<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CardIQ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070714">
<meta name="description" content="CardIQ — personal credit card routing, milestones and transfer-partner map">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Card IQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070714;--s0:rgba(255,255,255,.035);--s1:rgba(255,255,255,.06);
  --bd:rgba(110,130,220,.12);--bd2:rgba(110,130,220,.22);
  --accent:#38BDF8;--accentd:rgba(56,189,248,.14);--accentd2:rgba(56,189,248,.28);
  --gold:#FBBF24;--goldd:rgba(251,191,36,.13);--goldd2:rgba(251,191,36,.22);
  --green:#10B981;--greend:rgba(16,185,129,.14);--greend2:rgba(16,185,129,.24);
  --red:#F87171;--redd:rgba(248,113,113,.13);
  --amber:#FB923C;--purple:#A78BFA;--purpled:rgba(167,139,250,.14);
  --text:#EEF0F8;--text2:#A8B0C8;--muted:#555870;
  --r:14px;--safe-t:env(safe-area-inset-top,44px);--safe-b:env(safe-area-inset-bottom,34px);
  --nav:54px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Syne',sans-serif;background:var(--ink);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column;position:relative}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 55% 35% at 10% 8%,rgba(56,189,248,.07) 0%,transparent 70%),radial-gradient(ellipse 45% 35% at 90% 92%,rgba(251,191,36,.05) 0%,transparent 70%)}

/* header */
.hdr{flex-shrink:0;padding:calc(var(--safe-t) + 8px) 20px 13px;border-bottom:1px solid var(--bd);background:rgba(7,7,20,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);position:relative;z-index:20}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between}
.wordmark{font-size:25px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.wordmark em{color:var(--accent);font-style:normal}
.hdr-sub{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:500}
.live-chip{display:flex;align-items:center;gap:5px;background:var(--greend2);border:1px solid rgba(16,185,129,.35);border-radius:20px;padding:5px 10px;font-size:10.5px;font-weight:700;color:var(--green);letter-spacing:.6px;text-transform:uppercase}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulselive 2s ease-in-out infinite}
@keyframes pulselive{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}

/* screens */
.screens{flex:1;overflow:hidden;position:relative;z-index:1}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:16px 16px calc(var(--nav) + var(--safe-b) + 20px);display:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block;animation:scrin .22s ease both}
@keyframes scrin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
/* chat now in floating panel, no screen needed */

/* nav — 7 tabs, label only on active */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:5px 0 calc(var(--safe-b) + 3px);background:rgba(7,7,20,.9);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-top:1px solid var(--bd);display:flex}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border:none;background:none;cursor:pointer;color:var(--muted);transition:color .18s;font-family:'Syne',sans-serif}
.ntab.on{color:var(--accent)}
.ntab-icon{font-size:18px;line-height:1}
.ntab-lbl{display:none;font-size:8.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.ntab.on .ntab-lbl{display:block}

/* shared */
.stitle{font-size:21px;font-weight:800;letter-spacing:-.5px;margin-bottom:13px;line-height:1.1}
.gcard{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:9px}
.notice{border-radius:10px;padding:9px 13px;font-size:12.5px;line-height:1.5;margin-bottom:13px}
.n-green{background:var(--greend);border:1px solid rgba(16,185,129,.25);color:#6EE7B7}
.n-gold{background:var(--goldd);border:1px solid rgba(251,191,36,.25);color:#FCD34D}
/* ── FLOATING CHAT ── */
.chat-fab{position:fixed;bottom:calc(var(--nav) + var(--safe-b) + 12px);right:16px;z-index:150;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#1360A0,#38BDF8);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(56,189,248,.35);transition:transform .15s}
.chat-fab:active{transform:scale(.92)}
.chat-fab svg{width:22px;height:22px;fill:white}
.chat-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:160;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.chat-backdrop.on{display:block}
.chat-panel{position:fixed;bottom:0;left:0;right:0;z-index:170;background:var(--ink2);border-top:1px solid var(--bd);border-radius:20px 20px 0 0;display:flex;flex-direction:column;height:72vh;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
.chat-panel.on{transform:translateY(0)}
.chat-panel-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.chat-panel-title{font-size:15px;font-weight:800;letter-spacing:-.3px}
.chat-close{background:var(--s1);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center}
.chat-msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.chat-msgs::-webkit-scrollbar{display:none}
.chat-input-row{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(var(--safe-b) + 8px);border-top:1px solid var(--bd);flex-shrink:0;background:rgba(7,7,20,.92)}
.chatinput{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:9px 15px;font-size:14px;font-family:'Syne',sans-serif;color:var(--text);outline:none;resize:none;max-height:80px;min-height:38px;line-height:1.4}
.chatinput::placeholder{color:var(--muted)}
.sendbtn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#1360A0,#38BDF8);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 3px 12px rgba(56,189,248,.3)}
.sendbtn svg{width:15px;height:15px;fill:#fff}
.chip{background:var(--s0);border:1px solid var(--bd);border-radius:16px;padding:6px 12px;font-size:12px;font-weight:600;font-family:'Syne',sans-serif;white-space:nowrap;cursor:pointer;color:var(--text2);transition:all .14s;flex-shrink:0}
.chip:active{background:var(--accentd);border-color:var(--accentd2);color:var(--accent);transform:scale(.95)}
.chatlist{display:flex;flex-direction:column;gap:10px}
.mbot{align-self:flex-start;max-width:92%}.muser{align-self:flex-end;max-width:82%}
.mbub{padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.6}
.mbot .mbub{background:var(--s1);border:1px solid var(--bd);border-bottom-left-radius:4px}
.muser .mbub{background:linear-gradient(135deg,#1360A0,#38BDF8);color:#fff;border-bottom-right-radius:4px}
.mtime{font-size:10px;color:var(--muted);padding:2px 6px;font-family:'JetBrains Mono',monospace}
.muser .mtime{text-align:right}
.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin:0 2px;animation:tdot 1s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.14s}.typing span:nth-child(3){animation-delay:.28s}
@keyframes tdot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-4px);opacity:1}}

/* ── SPEND ── */
.cat-scroll{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.cat-scroll::-webkit-scrollbar{display:none}
.catbtn{background:var(--s0);border:1.5px solid var(--bd);border-radius:20px;padding:8px 13px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:all .15s;-webkit-user-select:none;white-space:nowrap;flex-shrink:0}
.catbtn:active{transform:scale(.96)}
.catbtn.sel{background:var(--accentd);border-color:rgba(56,189,248,.5)}
.cat-e{font-size:17px;line-height:1}.cat-n{font-size:12.5px;font-weight:700}
.cbadge{background:var(--greend);color:var(--green);font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;text-transform:uppercase;margin-left:2px}
.cbadge.cbw{background:var(--goldd);color:var(--gold)}

.rslide{animation:rslide .22s ease both}
@keyframes rslide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rhero{border-radius:var(--r);padding:2px;margin-bottom:9px;background:linear-gradient(135deg,rgba(56,189,248,.45),rgba(56,189,248,.08) 45%,rgba(251,191,36,.3))}
.rhero-in{background:rgba(9,9,22,.92);border-radius:calc(var(--r) - 2px);padding:17px}
.rtag{font-size:9.5px;font-weight:800;color:var(--accent);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px}
.rname{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.rsub{font-size:11.5px;color:var(--muted);margin-bottom:13px;margin-top:3px;font-weight:500}
.rretrow{display:flex;align-items:flex-end;gap:11px;margin-bottom:12px}
.rnum{font-family:'JetBrains Mono',monospace;font-size:54px;font-weight:700;line-height:1}
.rnum.ng{color:var(--green);text-shadow:0 0 28px rgba(16,185,129,.6)}
.rnum.nb{color:var(--accent);text-shadow:0 0 28px rgba(56,189,248,.6)}
.rnum.na{color:var(--gold);text-shadow:0 0 28px rgba(251,191,36,.5)}
.rlbl{font-size:12px;color:var(--muted);padding-bottom:5px;font-weight:500;line-height:1.4}
.rreason{font-size:13px;color:var(--text2);line-height:1.65;background:var(--s0);border-radius:9px;padding:10px 12px}
.rcaveat{font-size:12px;color:var(--gold);line-height:1.55;background:var(--goldd);border-radius:9px;padding:9px 12px;margin-top:7px;display:flex;gap:7px;align-items:flex-start}
.alts-hd{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:7px;margin-top:2px}
.altrow{background:var(--s0);border:1px solid var(--bd);border-radius:11px;padding:11px 13px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.altname{font-size:13.5px;font-weight:700}.altnote{font-size:11px;color:var(--muted);margin-top:2px}
.altrate{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap}

/* amount input + dynamic recommender */
.amt-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.amt-label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.amt-input{flex:1;background:var(--s1);border:1px solid var(--bd2);border-radius:10px;padding:9px 12px;font-size:15px;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text);outline:none;width:100%}
.amt-input::placeholder{color:var(--muted);font-family:'Syne',sans-serif;font-size:13px;font-weight:400}
.amt-input:focus{border-color:var(--accent)}
.dynrec{margin-top:4px;animation:rslide .2s ease both}
.dynrec-hd{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.rec-row{
  background:var(--s0);border:1px solid var(--bd);border-radius:12px;
  padding:11px 13px;margin-bottom:6px;
  display:flex;align-items:center;gap:10px;
}
.rec-row.winner{background:var(--greend);border-color:rgba(16,185,129,.3)}
.rec-rank{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);width:20px;flex-shrink:0}
.rec-info{flex:1;min-width:0}
.rec-card{font-size:13.5px;font-weight:700}
.rec-note{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.rec-boost{font-size:11px;color:var(--green);font-weight:700;margin-top:2px}
.rec-rate{text-align:right;flex-shrink:0}
.rec-pct{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700}
.rec-pct.top{color:var(--green);text-shadow:0 0 14px rgba(16,185,129,.5)}
.rec-pct.hi{color:var(--green)}
.rec-pct.md{color:var(--gold)}
.rec-pct.lo{color:var(--amber)}
.ms-tag{display:inline-block;background:var(--goldd2);color:var(--gold);font-size:9px;font-weight:800;padding:2px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.4px;margin-left:4px;vertical-align:middle}

/* ── MILESTONES TAB ── */
.ms-card{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:15px;margin-bottom:10px;position:relative}
.ms-card.done{border-color:rgba(16,185,129,.3);background:var(--greend)}
.ms-card.urgent{border-color:rgba(251,191,36,.3)}
.ms-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
.ms-card-name{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.ms-name{font-size:15px;font-weight:800;line-height:1.2}
.ms-period{font-size:11px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono',monospace}
.ms-eff-rate{text-align:right;flex-shrink:0}
.ms-eff-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.ms-eff-num{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;line-height:1;margin-top:2px}
.ms-eff-num.boosted{color:var(--green);text-shadow:0 0 16px rgba(16,185,129,.5)}
.ms-eff-num.base{color:var(--accent)}
.ms-eff-num.done-c{color:var(--muted)}

/* progress bar */
.ms-prog-wrap{margin-bottom:10px}
.ms-prog-labels{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
.ms-prog-spent{color:var(--text2);font-family:'JetBrains Mono',monospace;font-weight:600}
.ms-prog-thresh{color:var(--muted);font-family:'JetBrains Mono',monospace}
.ms-bar{height:4px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.ms-fill{height:100%;border-radius:3px;transition:width .4s ease}

/* input row */
.ms-input-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ms-input-lbl{font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:600}
.ms-input{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font-size:13px;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text);outline:none}
.ms-input:focus{border-color:var(--accent)}
.ms-txn-btns{display:flex;gap:6px;align-items:center}
.txn-btn{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:6px 14px;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;transition:all .12s;font-family:'Syne',sans-serif}
.txn-btn:active{background:var(--accentd)}

/* breakdown */
.ms-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.ms-bk{background:rgba(255,255,255,.025);border-radius:9px;padding:9px 10px}
.ms-bk-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.ms-bk-val{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700}
.ms-bk-val.g{color:var(--green)}.ms-bk-val.b{color:var(--accent)}.ms-bk-val.o{color:var(--gold)}.ms-bk-val.r{color:var(--red)}

/* deadline tag */
.ms-deadline{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.ms-dl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ms-done-badge{background:var(--greend);color:var(--green);border:1px solid rgba(16,185,129,.35);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;display:inline-flex;align-items:center;gap:4px}

/* txn progress (MRCC) */
.txn-pips{display:flex;gap:8px;margin-bottom:10px}
.txn-pip{width:36px;height:36px;border-radius:8px;background:var(--s1);border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .15s}
.txn-pip.done{background:var(--greend);border-color:rgba(16,185,129,.4)}

/* ── CARDS ── */
.ccard-row{display:flex;gap:12px;align-items:center;padding:13px 15px;cursor:pointer}
.ccard-art{width:116px;height:72px;border-radius:8px;flex-shrink:0;position:relative;overflow:hidden}
.ccard-art-inner{position:absolute;inset:0;padding:9px 11px;display:flex;flex-direction:column;justify-content:space-between}
.ccard-chip{width:18px;height:13px;background:rgba(255,255,255,.28);border-radius:2px}
.ccard-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.3px;text-shadow:0 1px 3px rgba(0,0,0,.6);line-height:1.3}
.ccard-iss{font-size:8px;color:rgba(255,255,255,.5)}
.ctext{flex:1;min-width:0}.cname{font-size:14.5px;font-weight:700}.ciss{font-size:11.5px;color:var(--muted);margin-top:2px}
.cchev{color:var(--muted);font-size:17px;transition:transform .2s;flex-shrink:0}
.cchev.op{transform:rotate(90deg)}
.cdet{padding:0 15px 13px;display:none}.cdet.op{display:block}
.primary-badge{display:inline-flex;align-items:center;gap:5px;background:var(--greend2);border:1px solid rgba(16,185,129,.35);border-radius:6px;padding:4px 9px;font-size:10px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.tag{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.tb{background:var(--accentd);color:var(--accent)}.tg{background:var(--greend);color:var(--green)}.to{background:var(--goldd);color:var(--gold)}.tr{background:var(--redd);color:var(--red)}.tp{background:var(--purpled);color:var(--purple)}.tl{background:var(--greend2);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.earns{margin-bottom:11px}
.erow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);gap:8px}
.erow:last-child{border-bottom:none}
.ecat{font-size:12px;color:var(--text2);flex:1;line-height:1.35}
.erate{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700;color:var(--accent);white-space:nowrap}
.eunit{font-size:10.5px;color:var(--muted);white-space:nowrap}
.infobox{background:rgba(255,255,255,.025);border:1px solid var(--bd);border-radius:9px;padding:11px 13px;font-size:12.5px;color:var(--text2);line-height:1.7}
.ig{color:var(--green);font-weight:700}.iw{color:var(--red);font-weight:700}.io{color:var(--gold);font-weight:700}.ia{color:var(--accent);font-weight:700}

/* ── OPTIMIZE ── */
.opthero{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:17px;margin-bottom:11px}
.opthd{font-size:15px;font-weight:800;margin-bottom:13px}
.rtrow{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}
.rtrow:last-child{border-bottom:none}
.rtspend{font-size:12.5px;color:var(--text2);flex:1;line-height:1.3}.rtcard{font-size:10.5px;color:var(--muted)}
.rtval{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;white-space:nowrap}
.rtval.top{color:var(--green);font-size:20px}.rtval.hi{color:var(--green)}.rtval.md{color:var(--gold)}.rtval.lo{color:var(--amber)}
.newtag{background:var(--greend);color:var(--green);font-size:8.5px;font-weight:800;padding:2px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.4px;vertical-align:middle;margin-left:3px}
.valrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}
.valrow:last-child{border-bottom:none}
.valname{font-size:13px;color:var(--text2)}.valnum{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--gold)}
.capcard{background:var(--s0);border:1px solid var(--bd);border-radius:11px;padding:13px 15px;margin-bottom:7px}
.caphd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.capname{font-size:13.5px;font-weight:700}.capsub{font-size:11px;color:var(--muted);margin-top:2px}.capval{font-family:'JetBrains Mono',monospace;font-size:15.5px;font-weight:700;color:var(--accent);white-space:nowrap}
.capbar{height:2.5px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}.capfill{height:100%;border-radius:2px}
.chain{background:var(--s0);border:1px solid var(--bd);border-radius:11px;padding:13px 15px;margin-bottom:7px}
.chaintitle{font-size:13.5px;font-weight:800;margin-bottom:7px}.chainsteps{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text2);line-height:1.8}
.chainyield{font-size:12.5px;font-weight:700;color:var(--green);margin-top:7px}.chainnote{font-size:11.5px;color:var(--muted);margin-top:3px}
.hzitem{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--bd)}.hzitem:last-child{border-bottom:none}
.hzdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.hztext{font-size:12.5px;color:var(--text2);line-height:1.55}.hzdate{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px}

/* ── NEWS ── */
.filter-chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:13px}
.filter-chips::-webkit-scrollbar{display:none}
.fchip{background:var(--s0);border:1px solid var(--bd);border-radius:16px;padding:6px 13px;font-size:12px;font-weight:700;font-family:'Syne',sans-serif;white-space:nowrap;cursor:pointer;color:var(--muted);transition:all .14s;flex-shrink:0}
.fchip.active{background:var(--accentd);border-color:var(--accentd2);color:var(--accent)}
.fchip:active{transform:scale(.95)}
.news-card{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:14px 15px;margin-bottom:9px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .15s}
.news-card:active{border-color:var(--bd2)}
.news-card.hidden{display:none}
.news-hot-glow{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--red),var(--amber),var(--gold));animation:hglow 2s ease-in-out infinite}
@keyframes hglow{0%,100%{opacity:.8}50%{opacity:.4}}
.news-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.news-src{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 7px;border-radius:5px;flex-shrink:0;white-space:nowrap}
.src-dip{background:rgba(167,139,250,.15);color:var(--purple)}
.src-lfal{background:rgba(56,189,248,.12);color:var(--accent)}
.src-cm{background:rgba(16,185,129,.12);color:var(--green)}
.src-ll{background:rgba(251,191,36,.12);color:var(--gold)}
.src-ai{background:rgba(248,113,113,.12);color:var(--red)}
.news-hot-pill{background:rgba(248,113,113,.18);color:var(--red);border:1px solid rgba(248,113,113,.3);font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase;display:inline-flex;align-items:center;gap:3px}
.hot-blink{width:5px;height:5px;border-radius:50%;background:var(--red);animation:pulselive 1.5s ease-in-out infinite}
.news-title{font-size:14.5px;font-weight:800;line-height:1.3;margin-bottom:5px;letter-spacing:-.2px}
.news-summary{font-size:12.5px;color:var(--text2);line-height:1.6;margin-bottom:8px}
.news-warn{background:var(--redd);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--red);margin-bottom:8px;line-height:1.4}
.news-impact{background:var(--greend);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--green);line-height:1.4}
.news-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.news-tags{display:flex;gap:5px;flex-wrap:wrap}
.ntag{font-size:10px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.04);padding:2px 7px;border-radius:10px}
.news-exp{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--gold);font-weight:700}
.news-read{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;display:flex;align-items:center;gap:3px}
.news-sources-hd{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;margin:16px 0 8px}
.source-link{display:flex;align-items:center;justify-content:space-between;background:var(--s0);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;margin-bottom:7px;text-decoration:none}
.source-link-name{font-size:13.5px;font-weight:700;color:var(--text)}
.source-link-url{font-size:11px;color:var(--muted)}
/* ── LOYALTY ── */
.loy-notice{background:var(--goldd);border:1px solid rgba(251,191,36,.25);border-radius:10px;padding:9px 13px;font-size:12.5px;line-height:1.5;color:#FCD34D;margin-bottom:13px}
.lcard{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.lcard-art{height:80px;position:relative;overflow:hidden;cursor:pointer}
.lcard-art-inner{position:absolute;inset:0;padding:12px 15px;display:flex;justify-content:space-between;align-items:flex-start}
.lcard-name{font-size:13px;font-weight:800;color:rgba(255,255,255,.9);text-shadow:0 1px 4px rgba(0,0,0,.5);letter-spacing:-.2px}
.lcard-short{font-size:10px;color:rgba(255,255,255,.55);margin-top:1px}
.lcard-status-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.3px;text-shadow:none;align-self:flex-start}
.lcard-body{padding:13px 15px;display:none}
.lcard-body.op{display:block}
.lcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.status-big{font-size:18px;font-weight:800;letter-spacing:-.3px}
.status-note{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
/* account number */
.acct-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;margin-bottom:10px}
.acct-icon{font-size:14px;flex-shrink:0}
.acct-lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.acct-num{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;flex:1;color:var(--text);cursor:pointer;transition:color .15s;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-num:hover{color:var(--accent)}
.acct-edit{background:none;border:1px solid var(--bd);border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;flex-shrink:0;font-family:'Syne',sans-serif;transition:all .12s}
.acct-edit:active{background:var(--accentd);color:var(--accent)}
.acct-input-wrap{display:none;flex-direction:column;gap:6px;margin-bottom:10px}
.acct-input-wrap.open{display:flex}
.acct-field{background:var(--s1);border:1px solid var(--bd2);border-radius:8px;padding:8px 11px;font-size:13px;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text);outline:none}
.acct-field:focus{border-color:var(--accent)}
.acct-save{background:var(--accentd);border:1px solid var(--accentd2);border-radius:8px;padding:7px 16px;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;font-family:'Syne',sans-serif;width:100%}
/* status progress */
.tier-block{margin-bottom:10px}
.tier-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.tier-name{font-size:11.5px;font-weight:700;color:var(--text2)}
.tier-pct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.tier-bar{height:3.5px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;margin-bottom:4px}
.tier-fill{height:100%;border-radius:2px}
.tier-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.tier-cur{font-family:'JetBrains Mono',monospace;color:var(--text2)}
.tier-target{font-family:'JetBrains Mono',monospace}
/* breakdown grid */
.lbd{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.lbd-cell{background:rgba(255,255,255,.025);border-radius:8px;padding:8px 10px}
.lbd-lbl{font-size:9.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.lbd-val{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700}
.lbd-val.g{color:var(--green)}.lbd-val.b{color:var(--accent)}.lbd-val.o{color:var(--gold)}.lbd-val.p{color:var(--purple)}
.lperks{font-size:12px;color:var(--text2);line-height:1.7}
.lperk-row{display:flex;gap:6px;align-items:baseline}
.hot-offer-bar{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--gold);line-height:1.5;margin-top:6px}
/* ── CHAT ── */
.chiprow{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:11px}
.chiprow::-webkit-scrollbar{display:none}
.chip{background:var(--s0);border:1px solid var(--bd);border-radius:16px;padding:7px 13px;font-size:12px;font-weight:600;font-family:'Syne',sans-serif;white-space:nowrap;cursor:pointer;color:var(--text2);transition:all .14s;flex-shrink:0}
.chip:active{background:var(--accentd);border-color:var(--accentd2);color:var(--accent);transform:scale(.95)}
.chatlist{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.mbot{align-self:flex-start;max-width:92%}.muser{align-self:flex-end;max-width:82%}
.mbub{padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.6}
.mbot .mbub{background:var(--s1);border:1px solid var(--bd);border-bottom-left-radius:4px}
.muser .mbub{background:linear-gradient(135deg,#1360A0,#38BDF8);color:#fff;border-bottom-right-radius:4px}
.mtime{font-size:10px;color:var(--muted);padding:2px 6px;font-family:'JetBrains Mono',monospace}
.muser .mtime{text-align:right}
.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin:0 2px;animation:tdot 1s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.14s}.typing span:nth-child(3){animation-delay:.28s}
@keyframes tdot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-4px);opacity:1}}
/* (chat now floating — see .chat-fab above) */

/* ── API KEY MODAL ── */
.apimodal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.apimodal-bg.on{display:flex}
.apimodal{background:#0D0D1F;border:1px solid var(--bd2);border-radius:20px;padding:24px;width:100%;max-width:380px}
.apimodal-title{font-size:17px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px}
.apimodal-sub{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:15px}
.apimodal-input{width:100%;background:var(--s1);border:1px solid var(--bd2);border-radius:10px;padding:10px 13px;font-size:13.5px;font-family:'JetBrains Mono',monospace;color:var(--text);outline:none;margin-bottom:10px;-webkit-text-security:disc}
.apimodal-input:focus{border-color:var(--accent)}
.apimodal-btn{width:100%;background:linear-gradient(135deg,#1360A0,#38BDF8);border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;margin-bottom:8px;font-family:'Syne',sans-serif}
.apimodal-skip{width:100%;background:none;border:1px solid var(--bd);border-radius:10px;padding:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Syne',sans-serif}
/* key icon button in chat header */
.key-icon-btn{background:var(--s1);border:1px solid var(--bd);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .15s}
.key-icon-btn:active{border-color:var(--accent)}
/* ── GMAIL SCAN ── */
.gmail-scan-btn{display:flex;align-items:center;gap:10px;background:var(--s0);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:13px;cursor:pointer;transition:border-color .15s;width:100%;font-family:'Syne',sans-serif;text-align:left}
.gmail-scan-btn:active{border-color:var(--accentd2);background:var(--accentd)}
.gmail-scan-icon{font-size:22px;flex-shrink:0}
.gmail-scan-text{flex:1}
.gmail-scan-title{font-size:13.5px;font-weight:700;color:var(--text)}
.gmail-scan-sub{font-size:11px;color:var(--muted);margin-top:2px}
.gmail-sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.gmail-sheet-bg.on{display:block}
.gmail-sheet{position:fixed;bottom:0;left:0;right:0;z-index:210;background:#0C0C1E;border-top:1px solid var(--bd);border-radius:20px 20px 0 0;max-height:78vh;display:flex;flex-direction:column}
.gmail-sheet-hd{padding:14px 18px 10px;border-bottom:1px solid var(--bd);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.gmail-sheet-title{font-size:15px;font-weight:800}
.gmail-sheet-close{background:var(--s1);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center}
.gmail-sheet-body{flex:1;overflow-y:auto;padding:12px 16px 4px}
.gmail-sheet-body::-webkit-scrollbar{display:none}
.txn-item{background:var(--s0);border:1px solid var(--bd);border-radius:10px;padding:10px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.txn-item.sel{border-color:rgba(16,185,129,.35);background:var(--greend)}
.txn-info{flex:1;min-width:0}
.txn-merchant{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn-detail{font-size:11px;color:var(--muted);margin-top:2px}
.txn-amt{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700;color:var(--accent);white-space:nowrap;flex-shrink:0}
.txn-check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--bd2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
.txn-check.on{background:var(--green);border-color:var(--green);color:#fff}
.gmail-apply-btn{margin:10px 16px calc(var(--safe-b) + 12px);background:linear-gradient(135deg,#1360A0,#38BDF8);border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;font-family:'Syne',sans-serif;flex-shrink:0}
/* ── REC ROW — points display ── */
.rec-pts{font-size:10px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono',monospace;text-align:right;white-space:nowrap}
/* ── CARD ART — network logo + image ── */
.ccard-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px}
.ccard-chip-row{display:flex;align-items:center;justify-content:space-between;width:100%}
.ccard-net{display:flex;align-items:center}
/* ── LOYALTY LOGO ── */
.lcard-logo{position:absolute;bottom:10px;right:14px;height:26px;width:auto;max-width:72px;object-fit:contain;opacity:.88;filter:brightness(0) invert(1);pointer-events:none}
/* ── ROUTES / TRANSFER GRAPH ── */
.rt-bar{display:flex;gap:7px;overflow-x:auto;margin-bottom:9px;padding-bottom:2px}
.rt-bar::-webkit-scrollbar{display:none}
.rt-f{background:var(--s0);border:1px solid var(--bd);border-radius:16px;padding:7px 13px;font:600 12px 'Syne',sans-serif;color:var(--text2);white-space:nowrap;cursor:pointer;flex-shrink:0}
.rt-f.on{background:var(--accentd);border-color:var(--accentd2);color:var(--accent)}
.rt-search-row{display:flex;gap:8px;margin-bottom:10px}
.rt-search{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:10px 13px;font:500 16px 'Syne',sans-serif;color:var(--text);outline:none;min-width:0}
.rt-search::placeholder{color:var(--muted);font-size:14px}
.rt-reset{width:42px;border-radius:12px;background:var(--s1);border:1px solid var(--bd);color:var(--text2);font-size:18px;cursor:pointer}
#rt-wrap{position:relative;height:min(62vh,640px);min-height:340px;border:1px solid var(--bd);border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,rgba(56,189,248,.06),transparent 70%),var(--s0);touch-action:none;margin-bottom:14px;user-select:none;-webkit-user-select:none}
#rt-svg{width:100%;height:100%;display:block;cursor:grab}
.rt-e{fill:none;stroke-width:1.6;stroke-opacity:.32;transition:stroke-opacity .2s,stroke-width .2s}
.rt-e.hop{stroke-dasharray:6 5;stroke-opacity:.45}
.rt-e.cut{stroke-dasharray:2 4}
.rt-n{cursor:pointer;transition:opacity .2s}
.rt-n.air circle{fill:#0E3A55;stroke:#38BDF8;stroke-width:2}
.rt-n.hotel rect{fill:#2E1F5A;stroke:#A78BFA;stroke-width:2}
.rt-n.anchor circle,.rt-n.anchor rect{stroke:#FBBF24;stroke-width:3}
.rt-pl{fill:#C8CEE2;font:600 15px 'Syne',sans-serif;text-anchor:middle;paint-order:stroke;stroke:#070714;stroke-width:4px;stroke-linejoin:round}
.rt-ct{fill:#fff;font:800 17px 'Syne',sans-serif;text-anchor:middle}
.rt-cl{fill:#A8B0C8;font:600 13px 'Syne',sans-serif;text-anchor:middle;paint-order:stroke;stroke:#070714;stroke-width:4px}
#rt-svg.has-sel .rt-e{stroke-opacity:.05}
#rt-svg.has-sel .rt-n{opacity:.18}
#rt-svg.has-sel .rt-e.hl{stroke-opacity:.95;stroke-width:3}
#rt-svg.has-sel .rt-n.hl{opacity:1}
.rt-n.focus circle,.rt-n.focus rect{stroke:#fff;stroke-width:4}
.rt-lb rect{fill:#0B0B1E;stroke-width:1.5}
.rt-lb text{fill:#fff;font:700 13px 'JetBrains Mono',monospace;text-anchor:middle}
.rt-legend{position:absolute;left:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:8px;font-size:10.5px;color:var(--text2);background:rgba(7,7,20,.75);padding:5px 9px;border-radius:10px;pointer-events:none}
.rt-legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.rt-legend i.dash{background:repeating-linear-gradient(90deg,#FBBF24 0 4px,transparent 4px 7px)}
.rt-hint{position:absolute;right:8px;top:8px;font-size:10.5px;color:var(--muted);background:rgba(7,7,20,.7);padding:4px 8px;border-radius:8px;pointer-events:none}
.rt-sec{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;margin:4px 0 8px}
.rt-sec span{text-transform:none;letter-spacing:0;font-weight:500;margin-left:6px}
.rt-sec.in{margin:12px 0 4px}
.rt-card{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.rt-card.sel{border-color:var(--accentd2)}
.rt-ch{display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 0 6px}
.rt-ch b{font-size:14px;font-weight:800}
.rt-ch small{font-size:11px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-go{color:var(--muted);font-size:16px;padding:0 4px;cursor:pointer}
.rt-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.rt-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd);cursor:pointer}
.rt-rank{width:18px;font:700 11px 'JetBrains Mono',monospace;color:var(--muted);flex-shrink:0}

.rt-arrow em{font-style:normal;color:var(--gold);margin-left:2px}
.rt-sub{flex-basis:100%;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.rt-val{text-align:right;flex-shrink:0}

.rt-val small{font-size:10px;color:var(--muted)}
.rt-note{font-size:12px;color:var(--text2);line-height:1.5;margin:4px 0 6px}
.rt-valedit{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);margin:2px 0 6px;flex-wrap:wrap}
.rt-valedit input{width:72px;background:var(--s1);border:1px solid var(--bd2);border-radius:8px;padding:5px 8px;color:var(--text);font:600 16px 'JetBrains Mono',monospace}
.rt-foot{font-size:11px;color:var(--muted);line-height:1.5;margin:6px 2px 10px}
/* ── CHAT UPGRADES ── */
.chat-hd-btns{display:flex;gap:6px}
.chat-panel-hd{gap:6px}
.chat-panel-title{flex:1}
.chat-model{font:500 10px 'JetBrains Mono',monospace;color:var(--muted);margin-top:2px;letter-spacing:0}
.key-icon-btn.on{border-color:var(--accent);background:var(--accentd)}
.chiprow{display:flex;gap:7px;overflow-x:auto;padding:8px 16px 6px;flex-shrink:0}
.chiprow::-webkit-scrollbar{display:none}
.chat-status{color:var(--text2);font-size:12.5px}
.cursor{color:var(--accent);animation:blink 1s steps(2) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.chat-src{margin-top:8px;padding-top:7px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:3px}
.chat-src a{font-size:11px;color:var(--accent);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbub .mdt{border-collapse:collapse;margin:6px 0;font-size:12px;width:100%}
.mbub .mdt th,.mbub .mdt td{border:1px solid var(--bd2);padding:4px 6px;text-align:left;vertical-align:top}
.mbub .mdt th{background:var(--s1)}
.mbub .mdl{margin:4px 0 4px 18px;padding:0}
.mbub .mdl li{margin:2px 0}
.mbub .mdh{font-weight:800;margin:6px 0 2px}
.mbub code{font:12px 'JetBrains Mono',monospace;background:var(--s1);padding:1px 4px;border-radius:4px}
.mbub .mdpre{font:11.5px 'JetBrains Mono',monospace;background:var(--s1);padding:8px;border-radius:8px;overflow-x:auto;white-space:pre}
.mbub a{color:var(--accent)}
.chatinput{font-size:16px}
/* ── PWA install hint ── */
.ios-hint{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + var(--safe-b) + 76px);z-index:160;background:#11122A;border:1px solid var(--accentd2);border-radius:14px;padding:11px 40px 11px 14px;font-size:12.5px;line-height:1.5;color:var(--text2);box-shadow:0 8px 30px rgba(0,0,0,.5)}

.ios-hint button{position:absolute;right:8px;top:8px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer}
@media (min-width:760px){ .screen{max-width:760px;margin:0 auto;left:0;right:0} #rt-wrap{height:min(70vh,760px)} }

// Milestone math
function msRemaining(def) {
  const cur = MS[def.id];
  return Math.max(0, def.threshold - cur);
}
function msBoost(def) {
  const rem = msRemaining(def);
  if (rem <= 0 || def.type === 'transaction') return 0;
  return (def.rewardValue / rem) * 100;
}
function msEffRate(def) {
  if (def.type === 'transaction') {
    const done = MS[def.id];
    if (done >= 4) return { rate: def.baseRate, boost: 0, done: true };
    const rem = 4 - done;
    const boostPerTxn = (def.rewardValue / (rem * def.txnMin)) * 100;
    return { rate: def.baseRate + boostPerTxn, boost: boostPerTxn, done: false };
  }
  const boost = msBoost(def);
  const done = msRemaining(def) <= 0;
  return { rate: done ? def.baseRate : def.baseRate + boost, boost, done };
}

function daysLeft(deadline) {

  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));

}

let selCatId = null;
function selcat(id){
  document.querySelectorAll('.catbtn').forEach(b=>b.classList.remove('sel'));

  selCatId = id;
  renderSpendResult(id, null);
}

function renderSpendResult(id, amt){
  const c = CATS.find(x=>x.id===id);
  const ahtml = c.alts.map(a=>`<div class="altrow"><div><div class="altname">${a.l}</div><div class="altnote">${a.n}</div></div><div class="altrate">${a.r}</div></div>`).join('');
  const rnum = c.rv>0?`<div class="rretrow"><div class="rnum ${c.rc}" id="rn-${id}">0.0%</div><div class="rlbl">gross/net<br>return</div></div>`:'';

  document.getElementById('catr').innerHTML=`<div class="rslide">
    <div class="rhero"><div class="rhero-in">
      <div class="rtag">Best card</div>
      <div class="rname">${c.best}</div>
      <div class="rsub">${c.bsub}</div>
      ${rnum}
      <div class="rreason">${c.why}</div>
      ${c.cav?`<div class="rcaveat">⚡<span>${c.cav}</span></div>`:''}
    </div></div>
    ${ahtml?`<div class="alts-hd">Alternatives</div>${ahtml}`:''}
    <div class="amt-row" style="margin-top:12px">
      <span class="amt-label">₹ Amount</span>
      <input class="amt-input" type="number" id="amtinp" placeholder="Enter spend amount…" value="${amt||''}" oninput="onAmt('${id}',this.value)">
    </div>
    <div id="dynrec"></div>
  </div>`;

  if(c.rv>0) animn(document.getElementById('rn-'+id), c.rv);
  if(amt) renderDyn(id, parseFloat(amt));
  document.getElementById('catr').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function onAmt(id, val){
  const amt = parseFloat(val);
  if(!val || isNaN(amt) || amt <= 0){
    document.getElementById('dynrec').innerHTML='';
    return;
  }
  renderDyn(id, amt);
}

function renderDyn(catId, amt){
  const cat = CATS.find(c=>c.id===catId);
  let rows = [];

  if(cat.dynCards === 'inr' || cat.dynCards === 'fuel'){
    const dcbDef=MS_DEFS.find(m=>m.id==='dcb_q'), dcbEff=msEffRate(dcbDef);
    const m4=MS_DEFS.find(m=>m.id==='mrcc_mo'), m4e=msEffRate(m4);
    const m20=MS_DEFS.find(m=>m.id==='mrcc_20k'), m20e=msEffRate(m20);
    const b4=m4e.done?0:m4e.boost, b20=m20e.done?0:m20e.boost, mb=b4+b20;
    const mrccRow={ card:'Amex MRCC + monthly bonuses', rate:1.4+mb,
      note:`1.4% base · ${MS.mrcc_mo}/4 txns · ${lakhs(MS.mrcc_20k)}/₹20K`,
      boost:mb, boostNote: mb>0?`+${b4.toFixed(1)}% 4-txn bonus (per ₹1.5k txn) · +${b20.toFixed(1)}% ₹20K bonus`:'',
      cls: mb>8?'hi':mb>3?'md':'lo' };
    const dcbRow={ card:'DCB Metal'+(dcbEff.done?'':' + quarterly milestone'), rate:(cat.dynCards==='fuel'?0:3.33)+(dcbEff.done?0:dcbEff.boost),
      note: cat.dynCards==='fuel' ? '0 RP on fuel · spend still counts to ₹4L' : `3.33% base${dcbEff.done?' · milestone done':''}`,
      boost: dcbEff.done?0:dcbEff.boost,
      boostNote: dcbEff.done?'':`${lakhs(msRemaining(dcbDef))} left to ₹4L → ₹${(dcbDef.rewardValue/1000).toFixed(0)}k bonus`,
      cls: dcbEff.rate>8?'hi':dcbEff.rate>5?'md':'lo' };
    if(cat.dynCards==='fuel'){
      rows=[ mrccRow,
        { card:'Amex Plat Charge', rate:3.5, note:'5 MR/₹100 × ₹0.7 · cap 5,000 MR/month', cls:'md', ptsRate:5, ptsProg:'MR' },
        dcbRow ];
    } else {
      rows=[
        { card:'HSBC Premier', rate:6.3, note:'3 pts/₹100 → Accor 1:1 · uncapped', cls:'md', ptsRate:3, ptsProg:'HSBC pts' },
        { card:'Axis Atlas', rate:6.4, note:'2 EM/₹100 → KrisFlyer 1:2 · burns Group A 30k/yr', cls:'md', ptsRate:2, ptsProg:'EDGE Miles' },
        dcbRow, mrccRow ];
    }
  } else if(Array.isArray(cat.dynCards)){
    rows = cat.dynCards.map(r=>({...r, rate:r.rate}));
  } else {
    document.getElementById('dynrec').innerHTML='';
    return;
  }

  rows.sort((a,b)=>b.rate-a.rate);

  let rhtml = `<div class="dynrec"><div class="dynrec-hd">Effective return on ${lakhs(amt)}</div>`;
  rows.forEach((r,i)=>{
    const cls = i===0 ? 'top' : r.cls||'lo';
    const pctStr = r.special || (r.rate>0 ? r.rate.toFixed(1)+'%' : '—');
    const rupeeVal = r.rate>0 ? Math.round(r.rate/100*amt) : 0;
    const ptsEarned = r.ptsRate ? Math.round(r.ptsRate*amt/100) : null;
    const topVal = ptsEarned ? `${ptsEarned.toLocaleString('en-IN')} ${r.ptsProg}` : pctStr;
    const subVal = ptsEarned ? `${pctStr} · ₹${rupeeVal.toLocaleString('en-IN')}` : (rupeeVal>0?`₹${rupeeVal.toLocaleString('en-IN')}`:'');
    rhtml += `<div class="rec-row${i===0?' winner':''}">
      <div class="rec-rank">${i===1?'②':i===2?'③':i===3?'④':'①'}</div>
      <div class="rec-info">
        <div class="rec-card">${r.card}${(r.boost||0)>0?`<span class="ms-tag">milestone</span>`:''}</div>
        <div class="rec-note">${r.note}</div>
        ${(r.boost||0)>0&&r.boostNote?`<div class="rec-boost">⚡ ${r.boostNote}</div>`:''}
      </div>
      <div class="rec-rate">
        <div class="rec-pct ${cls}" style="${ptsEarned?'font-size:13px;line-height:1.2':''}">${topVal}</div>
        ${subVal?`<div class="rec-pts">${subVal}</div>`:''}
      </div>
    </div>`;
  });
  rhtml += '</div>';
  document.getElementById('dynrec').innerHTML = rhtml;
}

function animn(el,target){
  const dur=680,t0=performance.now();
  const run=t=>{const p=Math.min((t-t0)/dur,1),e=1-(1-p)**3;el.textContent=(target*e).toFixed(1)+'%';if(p<1)requestAnimationFrame(run)};
  requestAnimationFrame(run);
}

function msBdHtml(def){
  const cur = MS[def.id];
  const rem = msRemaining(def);
  const boost = msBoost(def);
  const eff = msEffRate(def);
  return `
    <div class="ms-bk"><div class="ms-bk-lbl">Remaining</div><div class="ms-bk-val ${rem>0?'b':'g'}">${rem>0?lakhs(rem):'Done ✅'}</div></div>

    <div class="ms-bk"><div class="ms-bk-lbl">Milestone boost</div><div class="ms-bk-val ${boost>5?'g':boost>2?'o':'r'}">${rem>0?'+'+boost.toFixed(1)+'%':'—'}</div></div>
    <div class="ms-bk"><div class="ms-bk-lbl">Effective rate</div><div class="ms-bk-val ${eff.rate>10?'g':eff.rate>5?'o':'b'}">${eff.rate.toFixed(1)}%</div></div>
  `;
}

function updateMs(id, val){
  const n = Math.max(0, parseFloat(val)||0);
  MS[id] = n;
  const def = MS_DEFS.find(m=>m.id===id);
  // re-render breakdown
  const bd = document.getElementById('msbd-'+id);
  if(bd) bd.innerHTML = msBdHtml(def);
  // update progress bar
  const mc = document.getElementById('mc-'+id);
  if(mc){
    const fill = mc.querySelector('.ms-fill');
    if(fill){
      const pct = Math.min(100,(n/def.threshold)*100).toFixed(1);
      const col = pct>75?'var(--green)':pct>40?'var(--gold)':'var(--accent)';
      fill.style.width=pct+'%'; fill.style.background=col;
    }
    const progSpent = mc.querySelector('.ms-prog-spent');
    if(progSpent) progSpent.textContent = lakhs(n) + ' spent';
  }
  // update header rate
  const eff = msEffRate(def);
  const effEl = mc && mc.querySelector('.ms-eff-num');
  if(effEl){ effEl.textContent = eff.done?'✅':eff.rate.toFixed(1)+'%'; effEl.className='ms-eff-num '+(eff.done?'done-c':eff.rate>10?'boosted':'base'); }
  // re-render dynrec if on spend tab
  if(selCatId){
    const inp = document.getElementById('amtinp');
    if(inp && inp.value) renderDyn(selCatId, parseFloat(inp.value));
  }
  // update notice bar
  const notice = document.querySelector('#screen-miles .notice');
  if(notice){ notice.textContent=dcbNotice(); }
  saveMS();
}

function txnPip(id, count){
  MS[id] = count > MS[id] ? count : count - 1; // toggle
  if(MS[id]<0) MS[id]=0;
  const def = MS_DEFS.find(m=>m.id===id);
  const mc = document.getElementById('mc-'+id);
  // re-render pips
  const pipsEl = document.getElementById('pips-'+id);
  if(pipsEl) pipsEl.innerHTML = Array.from({length:4},(_,i)=>`<div class="txn-pip ${i<MS[id]?'done':''}" onclick="txnPip('${id}',${i+1})">${i<MS[id]?'✓':(i+1)}</div>`).join('');
  // re-render breakdown
  const bd = document.getElementById('msbd-'+id);
  if(bd) bd.innerHTML = msBdHtml(def);
  // update header rate
  const eff = msEffRate(def);
  const effEl = mc && mc.querySelector('.ms-eff-num');
  if(effEl){ effEl.textContent=eff.done?'Done':eff.rate.toFixed(0)+'%'; }
  saveMS();
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function mdRender(src){
  const blocks=[]; let t=esc(src).replace(/```[\w-]*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push(`<pre class="mdpre">${c}</pre>`);return `\u0000${blocks.length-1}\u0000`;});
  const lines=t.split('\n'), out=[]; let i=0;
  const inline=s=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      let h=`<table class="mdt"><tr>${row(l).map(c=>`<th>${c}</th>`).join('')}</tr>`; i+=2;
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ h+=`<tr>${row(lines[i]).map(c=>`<td>${c}</td>`).join('')}</tr>`; i++; }
      out.push(h+'</table>'); continue;
    }
    if(/^\s*[-*•]\s+/.test(l)){ let h='<ul class="mdl">'; while(i<lines.length && /^\s*[-*•]\s+/.test(lines[i])){ h+=`<li>${inline(lines[i].replace(/^\s*[-*•]\s+/,''))}</li>`; i++; } out.push(h+'</ul>'); continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ let h='<ol class="mdl">'; while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ h+=`<li>${inline(lines[i].replace(/^\s*\d+[.)]\s+/,''))}</li>`; i++; } out.push(h+'</ol>'); continue; }
    const hm=l.match(/^#{1,4}\s+(.*)/); if(hm){ out.push(`<div class="mdh">${inline(hm[1])}</div>`); i++; continue; }
    out.push(l.trim()?inline(l):'<br>'); i++;
  }
  return out.join('\n').replace(/\n(?!<)/g,'<br>').replace(/\u0000(\d+)\u0000/g,(_,n)=>blocks[+n]);
}

let chatInited=false;
let chatHistory=[]; try{ chatHistory=JSON.parse(localStorage.getItem('ciq_chat')||'[]'); }catch(e){}
function saveChat(){ try{ localStorage.setItem('ciq_chat',JSON.stringify(chatHistory.slice(-30))); }catch(e){} }
const webOn=()=>localStorage.getItem('ciq_web')!=='0';

function buildChat(){
  if(chatInited) return; chatInited=true;
  const hd=document.querySelector('.chat-panel-hd'), close=hd.querySelector('.chat-close');
  const mk=(html,title,fn,cls='')=>{ const b=document.createElement('button'); b.className='key-icon-btn '+cls; b.title=title; b.innerHTML=html; b.onclick=fn; hd.insertBefore(b,close); return b; };
  const grp=document.createElement('div'); grp.className='chat-hd-btns';
  const wb=mk('🌐','Web search on/off',()=>{ localStorage.setItem('ciq_web',webOn()?'0':'1'); wb.classList.toggle('on',webOn()); botmsg(webOn()?'Web search **on** — I\'ll check live sources when useful.':'Web search **off** — answers from CardIQ data only (cheaper, faster).'); }, webOn()?'on':'');
  mk('🗑','Clear chat',()=>{ chatHistory=[]; saveChat(); document.getElementById('cl').innerHTML=''; greet(); });
  mk('🔑','Set Anthropic API key',()=>showApiModal('ciq_anthropic_key','Anthropic API Key',`Paste a key from console.anthropic.com to enable live chat (${AI_MODEL}). Stored only in this browser — never in the code or on GitHub. Tip: give the key a monthly spend limit.`,'sk-ant-…',()=>botmsg('Key saved ✅ Ask me anything.')));
  const sub=document.createElement('div'); sub.className='chat-model'; sub.textContent=AI_MODEL+' · streaming';
  hd.querySelector('.chat-panel-title').appendChild(sub);
  const cl=document.getElementById('cl'), chipDiv=document.createElement('div');
  chipDiv.className='chiprow'; chipDiv.innerHTML=CHIPS.map(c=>`<button class="chip" onclick="chipq(this.textContent)">${esc(c)}</button>`).join('');
  cl.before(chipDiv);
  chatHistory.forEach(m=> m.role==='user'?usermsg(m.content,true):botmsg(mdRender(m.content),false,true));
  if(!chatHistory.length) greet();
}
function greet(){
  const hasKey=!!localStorage.getItem('ciq_anthropic_key'), d=MS_DEFS[0];
  botmsg(mdRender(`Hey Romil 👋 DCB quarterly is at **${lakhs(MS[d.id])}** of ₹4L (${msEffRate(d).rate.toFixed(1)}% effective). Axis Group A resets in **${daysLeft('2026-12-31')} days**.\n\n`+(hasKey?'Ask me anything — live AI with your full card + transfer data.':'Tap 🔑 to add your Anthropic key for live answers. Until then I answer from built-in data.')));
}
function chipq(t){ document.getElementById('ci').value=t; send(); }
function botmsg(html,typing=false,noScroll=false){
  const cl=document.getElementById('cl'), d=document.createElement('div'); d.className='mbot';
  if(typing){ d.innerHTML=`<div class="mbub"><span class="typing"><span></span><span></span><span></span></span></div>`; }
  else{ const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); d.innerHTML=`<div class="mbub">${html.includes('<')?html:mdRender(html)}</div><div class="mtime">${t}</div>`; }
  cl.appendChild(d); if(!noScroll) d.scrollIntoView({behavior:'smooth',block:'end'}); return d;
}
function usermsg(text,noScroll=false){
  const cl=document.getElementById('cl'), d=document.createElement('div'); d.className='muser';
  d.innerHTML=`<div class="mbub">${esc(text)}</div><div class="mtime">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
  cl.appendChild(d); if(!noScroll) d.scrollIntoView({behavior:'smooth',block:'end'});
}
let chatBusy=false;
async function send(){
  const inp=document.getElementById('ci'), text=inp.value.trim(); if(!text||chatBusy) return;
  inp.value=''; inp.style.height='auto'; usermsg(text);
  if(!localStorage.getItem('ciq_anthropic_key')){ botmsg(mdRender(reply(text)+'\n\n*Built-in answer — tap 🔑 for live AI.*')); return; }
  chatBusy=true;
  const wrap=botmsg('',true), bub=wrap.querySelector('.mbub'); let raf=0, latest='';
  const ui={ text:t=>{ latest=t; if(!raf) raf=requestAnimationFrame(()=>{ raf=0; bub.innerHTML=mdRender(latest)+'<span class="cursor">▍</span>'; document.getElementById('cl').scrollTop=1e9; }); },
             status:s=>{ if(!latest) bub.innerHTML=`<span class="chat-status">${s}</span>`; } };
  try{
    const {text:out,sources}=await callClaudeStream(text,ui);
    cancelAnimationFrame(raf);
    bub.innerHTML=mdRender(out||'…')+(sources.length?`<div class="chat-src">${sources.slice(0,5).map((s,i)=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${i+1}. ${esc((s.title||s.url).slice(0,60))}</a>`).join('')}</div>`:'');
  }catch(err){
    cancelAnimationFrame(raf);
    bub.innerHTML=mdRender(`⚠️ ${err.message}\n\n**Built-in answer:**\n`+reply(text));
  }finally{ chatBusy=false; const tm=document.createElement('div'); tm.className='mtime'; tm.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); wrap.appendChild(tm); }
}

async function callClaudeStream(userText, ui){
  const key=localStorage.getItem('ciq_anthropic_key'); if(!key) throw new Error('No API key — tap 🔑');
  chatHistory.push({role:'user',content:userText}); saveChat();
  let msgs=chatHistory.slice(-16).map(m=>({role:m.role,content:m.content}));
  while(msgs.length&&msgs[0].role!=='user') msgs.shift();
  let finalText=''; const sources=[];
  for(let turn=0; turn<3; turn++){
    const body={ model:AI_MODEL, max_tokens:1500, stream:true, system:buildSystemPrompt(), messages:msgs };
    if(webOn()) body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:3,user_location:{type:'approximate',country:'IN',timezone:'Asia/Kolkata'}}];
    const r=await fetch('https://api.anthropic.com/v1/messages',{ method:'POST',
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify(body) });
    if(!r.ok){ let m=''; try{ const j=await r.json(); m=(j.error&&j.error.message)||''; }catch(e){}
      if(r.status===401) m='API key rejected — tap 🔑 to update it.';
      if(r.status===404) m=`Model "${AI_MODEL}" not available on this key. ${m}`;
      if(r.status===429) m='Rate limited — try again in a moment.';
      chatHistory.pop(); saveChat(); throw new Error(m||`API error ${r.status}`); }
    const reader=r.body.getReader(), dec=new TextDecoder(); let buf='', stop=null; const blocks=[];
    for(;;){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const raw=buf.slice(0,i); buf=buf.slice(i+2);
        const dl=raw.split('\n').filter(l=>l.startsWith('data:')).map(l=>l.slice(5).trim()).join('');
        if(!dl) continue; let ev; try{ ev=JSON.parse(dl); }catch(e){ continue; }
        if(ev.type==='content_block_start'){
          const b=JSON.parse(JSON.stringify(ev.content_block));
          if(b.type==='text') b.text=b.text||'';
          if(b.type==='server_tool_use'){ b._json=''; ui.status('🔎 Searching the web…'); }
          if(b.type==='web_search_tool_result') ui.status('📄 Reading sources…');
          blocks[ev.index]=b;
        } else if(ev.type==='content_block_delta'){
          const b=blocks[ev.index], d=ev.delta; if(!b) continue;
          if(d.type==='text_delta'){ b.text+=d.text; finalText+=d.text; ui.text(finalText); }
          else if(d.type==='input_json_delta'){ b._json+=d.partial_json||''; }
          else if(d.type==='citations_delta'){ (b.citations=b.citations||[]).push(d.citation); const c=d.citation||{}; if(c.url&&!sources.some(s=>s.url===c.url)) sources.push({url:c.url,title:c.title}); }
        } else if(ev.type==='content_block_stop'){
          const b=blocks[ev.index]; if(b&&b.type==='server_tool_use'){ try{ b.input=JSON.parse(b._json||'{}'); }catch(e){ b.input={}; } delete b._json; }
        } else if(ev.type==='message_delta'){ stop=ev.delta&&ev.delta.stop_reason; }
        else if(ev.type==='error'){ throw new Error((ev.error&&ev.error.message)||'Stream error'); }
      }
    }
    if(stop==='pause_turn'){ msgs=[...msgs,{role:'assistant',content:blocks.filter(Boolean)}]; continue; }
    break;
  }
  chatHistory.push({role:'assistant',content:finalText||'…'}); saveChat();
  return {text:finalText,sources};
}

function lsGet(key,def){ try{const v=localStorage.getItem(key);return v?JSON.parse(v):def}catch(e){return def} }
function lsSet(key,val){ try{localStorage.setItem(key,JSON.stringify(val))}catch(e){} }

function togLoy(id){
  const b=document.getElementById('lb-'+id);
  b.classList.toggle('op');
}

function toggleNum(id){
  const p=PROGRAMS.find(x=>x.id===id);
  const saved=lsGet(p.lsKey,{});
  if(!saved.num) return editLoy(id);
  const el=document.getElementById('an-'+id);
  const showing=el.dataset.showing==='1';
  el.textContent=showing?'••••••••':saved.num;
  el.dataset.showing=showing?'':'1';
  const apEl=document.getElementById('ap-'+id);
  if(apEl&&saved.pin){ apEl.textContent=showing?'••••••••':saved.pin; apEl.dataset.showing=showing?'':'1'; }
}

function editLoy(id){
  const wrap=document.getElementById('ai-'+id);
  const open=wrap.classList.contains('open');
  wrap.classList.toggle('open',!open);
  if(!open){ const inp=document.getElementById('af-num-'+id); if(inp) inp.focus(); }
}

function saveLoy(id){
  const p=PROGRAMS.find(x=>x.id===id);
  const num=document.getElementById('af-num-'+id).value.trim();
  const pin=document.getElementById('af-pin-'+id).value.trim();
  const existing=lsGet(p.lsKey,{});
  lsSet(p.lsKey,{...existing,num,pin});
  // update display
  const el=document.getElementById('an-'+id);
  if(el){ el.textContent=num?'••••••••':'— add number'; el.dataset.showing=''; }
  const apEl=document.getElementById('ap-'+id);
  if(apEl&&pin){ apEl.textContent='••••••••'; apEl.dataset.showing=''; }
  document.getElementById('ai-'+id).classList.remove('open');
}

function updateLoyProg(id,idx,val){
  const p=PROGRAMS.find(x=>x.id===id);
  const saved=lsGet(p.lsKey,{progOverrides:{}});
  if(!saved.progOverrides) saved.progOverrides={};
  saved.progOverrides[idx]=parseFloat(val)||0;
  lsSet(p.lsKey,saved);
  // update bar
  const pr=p.prog[idx];
  const pct=Math.min(100,(saved.progOverrides[idx]/pr.target)*100);
  const bars=document.querySelectorAll(`#lc-${id} .tier-fill`);
  if(bars[idx]) bars[idx].style.width=pct+'%';
  const pcts=document.querySelectorAll(`#lc-${id} .tier-pct`);
  if(pcts[idx]) pcts[idx].textContent=pct.toFixed(0)+'%';
}

// GMAIL INTEGRATION
// ══════════════════════════════════════════════════════════
let _gmailTxns=[];
let _gsiLoaded=false;
let _tokenClient=null;

function scanGmail(){
  const clientId=localStorage.getItem('ciq_google_client_id');
  if(!clientId){
    showApiModal('ciq_google_client_id','Google Client ID',
      'Create an OAuth 2.0 Client ID at console.cloud.google.com → APIs & Services → Credentials. Enable Gmail API. Add your domain/localhost as authorised origin.',
      'your-client-id.apps.googleusercontent.com',
      ()=>scanGmail());
    return;
  }
  if(!_gsiLoaded||!window.google?.accounts?.oauth2){
    const sub=document.getElementById('gmail-scan-sub');
    if(sub) sub.textContent='Loading Google auth…';
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client';
    s.onload=()=>{ _gsiLoaded=true; _initTokenClient(clientId); };
    s.onerror=()=>{ if(sub) sub.textContent='Failed to load Google auth'; };
    document.head.appendChild(s);
    return;
  }
  _initTokenClient(clientId);
}

function _initTokenClient(clientId){
  _tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:clientId,
    scope:'https://www.googleapis.com/auth/gmail.readonly',
    callback:_handleGToken
  });
  _tokenClient.requestAccessToken({prompt:''});
}

async function _handleGToken(resp){
  const sub=document.getElementById('gmail-scan-sub');
  if(resp.error){ if(sub) sub.textContent='Sign-in failed: '+resp.error; return; }
  if(sub) sub.textContent='Scanning…';
  try{
    await _fetchGmail(resp.access_token);
  }catch(e){
    if(sub) sub.textContent='Scan error: '+e.message;
  }
}

async function _fetchGmail(token){
  const q=encodeURIComponent('(from:(alerts@hdfcbank.net OR infoindia@americanexpress.com OR alerts@axisbank.com OR notify@alerts.hsbc.co.in OR alerts@hsbc.co.in OR txnalert@axisbank.com) OR subject:(spent on your OR debit alert OR credit card transaction)) newer_than:90d');
  const listR=await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${q}&maxResults=75`,{headers:{Authorization:`Bearer ${token}`}});
  if(!listR.ok) throw new Error('Gmail API '+listR.status+' — check Client ID & scopes');
  const list=await listR.json();
  const msgs=list.messages||[];
  const sub=document.getElementById('gmail-scan-sub');
  if(!msgs.length){ if(sub) sub.textContent='No transaction emails found'; return; }
  if(sub) sub.textContent=`Fetching ${msgs.length} emails…`;
  const details=await Promise.all(msgs.slice(0,60).map(m=>
    fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${m.id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`,
      {headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json())
  ));
  _gmailTxns=_parseTxns(details);
  if(sub) sub.textContent=`Found ${_gmailTxns.length} transactions`;
  _showGmailSheet(_gmailTxns);
}

function _parseTxns(emails){
  const out=[];
  for(const e of emails){
    if(!e.payload) continue;
    const hdr=Object.fromEntries((e.payload.headers||[]).map(h=>[h.name,h.value]));
    const subj=hdr.Subject||'', from=hdr.From||'', dateStr=hdr.Date||'';
    const txn=_parseLine(subj,from,new Date(dateStr));
    if(txn) out.push(txn);
  }
  return out.sort((a,b)=>b.date-a.date);
}

function _parseLine(subj,from,date){
  // Match Indian bank alert patterns
  const amtM=subj.match(/(?:INR|Rs\.?|₹)\s*([\d,]+(?:\.\d{1,2})?)/i);
  if(!amtM) return null;
  const amount=parseFloat(amtM[1].replace(/,/g,''));
  if(!amount||amount<1||amount>10000000) return null;

  const src=(from+' '+subj).toLowerCase();
  let card='',cardId='',cardShort='';
  if(/hdfc|diners|dcb/.test(src)){card='DCB Metal';cardId='dcb_q';cardShort='DCB';}
  else if(/mrcc|membership reward/.test(src)){card='Amex MRCC';cardId='mrcc_20k';cardShort='MRCC';}
  else if(/amex|american express|platinum travel/.test(src)){card='Amex Plat Travel';cardId='amex_pt2';cardShort='Amex PT';}
  else if(/amex|american express/.test(src)){card='Amex';cardId='';cardShort='Amex';}
  else if(/hsbc/.test(src)){card='HSBC';cardId='';cardShort='HSBC';}
  else if(/axis/.test(src)){card='Axis';cardId='';cardShort='Axis';}
  else{card='Card';cardId='';cardShort='';}

  const mM=subj.match(/(?:at|merchant[:\s]+|towards)\s+([A-Za-z][A-Za-z0-9\s&'.,-]{2,28}?)(?:\s+on\s+|\s+dated|\s+for\s+|\s*$)/i);
  const merchant=mM?mM[1].trim():'Unknown';
  const cat=_inferCat(merchant);

  return {amount,merchant,card,cardId,cardShort,cat,date,sel:true};
}

function _inferCat(m){
  const s=m.toLowerCase();
  if(/marriott|accor|hilton|hyatt|ihg|sheraton|westin|taj|oberoi|itc hotel/.test(s)) return 'Hotel Direct';
  if(/indigo|air india|spicejet|vistara|airasia|go first/.test(s)) return 'Direct Airline MCC';
  if(/klook/.test(s)) return 'Klook / Tours';
  if(/getyourguide/.test(s)) return 'GetYourGuide';
  if(/amazon|flipkart|myntra|ajio|nykaa|meesho|tata cliq/.test(s)) return 'INR Shopping';
  if(/swiggy|zomato|dominos|mcdonalds|starbucks|café|restaurant|pizza|biryani/.test(s)) return 'Dining';
  return 'INR Shopping';
}

function _showGmailSheet(txns){
  const list=document.getElementById('gmail-txn-list');
  if(!txns.length){list.innerHTML='<div style="text-align:center;color:var(--muted);padding:20px">No transactions parsed</div>';return;}
  list.innerHTML=txns.map((t,i)=>`
    <div class="txn-item${t.sel?' sel':''}" onclick="_toggleTxn(${i})">
      <div class="txn-check${t.sel?' on':''}">${t.sel?'✓':''}</div>
      <div class="txn-info">
        <div class="txn-merchant">${t.merchant}</div>
        <div class="txn-detail">${t.cardShort||t.card} · ${t.cat} · ${t.date.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div>
      </div>
      <div class="txn-amt">₹${t.amount.toLocaleString('en-IN')}</div>
    </div>`).join('');
  document.getElementById('gmail-sheet-bg').classList.add('on');
}

function _toggleTxn(i){
  _gmailTxns[i].sel=!_gmailTxns[i].sel;
  _showGmailSheet(_gmailTxns);
}

function closeGmailSheet(){
  document.getElementById('gmail-sheet-bg').classList.remove('on');
}

function applyGmailTransactions(){
  const sel=_gmailTxns.filter(t=>t.sel&&t.cardId);
  const totals={};
  sel.forEach(t=>{
    if(!totals[t.cardId]) totals[t.cardId]=0;
    totals[t.cardId]+=t.amount;
  });
  Object.entries(totals).forEach(([id,amt])=>{
    const cur=MS[id]||0;
    MS[id]=cur+amt;
    const inp=document.getElementById('msi-'+id);
    if(inp){inp.value=MS[id];updateMs(id,MS[id]);}
    if(id==='amex_pt2'){ MS.amex_pt3=(MS.amex_pt3||0)+amt; const i3=document.getElementById('msi-amex_pt3'); if(i3){i3.value=MS.amex_pt3;updateMs('amex_pt3',MS.amex_pt3);} }
  });
  saveMS();
  closeGmailSheet();
  const totalAmt=Object.values(totals).reduce((a,b)=>a+b,0);
  const sub=document.getElementById('gmail-scan-sub');
  if(sub) sub.textContent=`Applied ${sel.length} txn${sel.length!==1?'s':''} · ₹${totalAmt.toLocaleString('en-IN')} added`;
}

function getVals(){
  let o={}; try{ o=JSON.parse(localStorage.getItem('ciq_vals')||'{}'); }catch(e){}
  const V={}; TX_PROG.forEach(p=>V[p.id]=(o[p.id]!=null?+o[p.id]:p.v)); return V;
}
function setVal(id,v){
  let o={}; try{ o=JSON.parse(localStorage.getItem('ciq_vals')||'{}'); }catch(e){}
  const n=parseFloat(v); if(isNaN(n)||n<0) return;
  o[id]=n; try{ localStorage.setItem('ciq_vals',JSON.stringify(o)); }catch(e){}
  if(RT.sel) rtPanel();
}
function ratioLbl(e){ if(e.lbl) return e.lbl; const r=e.r; const f=x=>(+x.toFixed(2)).toString(); return r>=1?`1:${f(r)}`:`${f(1/r)}:1`; }
const TX_NAME = id => (TX_CUR.find(c=>c.id===id)||TX_PROG.find(p=>p.id===id)||{}).short||id;

// ── path engine: all simple paths ≤3 transfers from a currency ──
function txPaths(from, opts={}){
  const hops = opts.hops!==false, out=[];
  const adj={}; TX_EDGES.forEach(e=>{ if(e.hop&&!hops) return; (adj[e.f]=adj[e.f]||[]).push(e); });
  const V=getVals();
  (function dfs(node, path, seen, ratio){
    (adj[node]||[]).forEach(e=>{
      if(seen.has(e.t)) return;
      const r=ratio*e.r, p=[...path,e];
      out.push({ from, to:e.t, edges:p, ratio:r, value:r*(V[e.t]||0) });
      if(p.length<3) dfs(e.t, p, new Set([...seen,e.t]), r);
    });
  })(from, [], new Set([from]), 1);
  return out;
}
function txPrune(paths){
  const sorted=[...paths].sort((a,b)=>b.value-a.value||a.edges.length-b.edges.length), kept=[];
  sorted.forEach(p=>{ if(!kept.some(q=>q.from===p.from&&q.to===p.to&&q.value>=p.value-1e-9&&q.edges.length<=p.edges.length)) kept.push(p); });
  return kept;
}
function txBestByDest(from, opts){
  const best={}; txPaths(from,opts).forEach(p=>{ if(!best[p.to]||p.value>best[p.to].value) best[p.to]=p; });
  return Object.values(best).sort((a,b)=>b.value-a.value);
}

const RT={ built:false, sel:null, filter:'all', hops:true, tf:{x:0,y:0,k:1}, pos:{} };

function rtLayout(){
  // deterministic force layout; currencies pinned to corners
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const N=[], idx={};
  TX_CUR.forEach(c=>{ idx[c.id]=N.length; N.push({id:c.id,x:c.pos[0],y:c.pos[1],vx:0,vy:0,pin:true}); });
  TX_PROG.forEach((p,i)=>{ const a=i/TX_PROG.length*Math.PI*2; idx[p.id]=N.length;
    N.push({id:p.id,x:500+Math.cos(a)*260+rnd()*40,y:500+Math.sin(a)*260+rnd()*40,vx:0,vy:0}); });
  const seenL=new Set(), L=[];
  TX_EDGES.forEach(e=>{ const k=[e.f,e.t].sort().join('|'); if(seenL.has(k)) return; seenL.add(k); L.push({a:idx[e.f],b:idx[e.t],len:e.hop?120:300,k:e.hop?0.03:0.012}); });
  for(let it=0;it<420;it++){
    const alpha=1-it/420;
    for(let i=0;i<N.length;i++) for(let j=i+1;j<N.length;j++){
      const A=N[i],B=N[j]; let dx=B.x-A.x, dy=B.y-A.y, d2=dx*dx+dy*dy||1, d=Math.sqrt(d2);
      let f=Math.min(9000/d2,6); if(d<58) f+= (58-d)*0.25;
      dx/=d; dy/=d; A.vx-=dx*f; A.vy-=dy*f; B.vx+=dx*f; B.vy+=dy*f;
    }
    L.forEach(l=>{ const A=N[l.a],B=N[l.b]; const dx=B.x-A.x, dy=B.y-A.y, d=Math.sqrt(dx*dx+dy*dy)||1; const f=(d-l.len)*l.k;
      A.vx+=dx/d*f; A.vy+=dy/d*f; B.vx-=dx/d*f; B.vy-=dy/d*f; });
    N.forEach(n=>{ if(n.pin){n.vx=n.vy=0;return;}
      n.vx+=(500-n.x)*0.004; n.vy+=(500-n.y)*0.004;
      n.x+=n.vx*alpha*0.9; n.y+=n.vy*alpha*0.9; n.vx*=0.6; n.vy*=0.6;
      n.x=Math.max(50,Math.min(950,n.x)); n.y=Math.max(50,Math.min(950,n.y)); });
  }
  N.forEach(n=>RT.pos[n.id]=[n.x,n.y]);
}

function rtDraw(){

    const mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1, off=e.hop?0.12:0.06;

  });

    nh+=`<g class="rt-n ${p.t}${p.anchor?' anchor':''}" data-id="${p.id}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})">${shape}<text class="rt-pl" y="${r+17}">${p.short}</text></g>`; });
  ng.innerHTML=nh;
  rtApplySel(); rtApplyTf();
}

function rtApplySel(){

  svg.classList.toggle('has-sel',!!RT.sel);
  const hint=document.querySelector('.rt-hint'); if(hint) hint.textContent=RT.sel?`${TX_NAME(RT.sel)} · routes listed below ↓`:'Pinch / drag · tap a node';
  svg.querySelectorAll('.rt-e.hl,.rt-n.hl,.rt-n.focus').forEach(x=>x.classList.remove('hl','focus'));
  if(!RT.sel) return;
  const id=RT.sel, isCur=TX_CUR.some(c=>c.id===id), edges=new Set(), nodes=new Set([id]);
  if(isCur){
    TX_EDGES.forEach((e,i)=>{ if(e.f===id&&rtVisible(e.t)){ edges.add(i); nodes.add(e.t); } });
  } else {
    txPrune(TX_CUR.flatMap(c=>txPaths(c.id,{hops:RT.hops}).filter(p=>p.to===id))).forEach(p=>p.edges.forEach(e=>{ edges.add(TX_EDGES.indexOf(e)); nodes.add(e.f); nodes.add(e.t); }));
  }
  let lh='';
  edges.forEach(i=>{ const pe=svg.querySelector(`.rt-e[data-e="${i}"]`); if(!pe) return; pe.classList.add('hl');
    const e=TX_EDGES[i], G=RT.geo[i], t=0.55, u=1-t, pt={x:u*u*G[0]+2*u*t*G[2]+t*t*G[4], y:u*u*G[1]+2*u*t*G[3]+t*t*G[5]}, txt=ratioLbl(e)+(e.g?` ·${e.g}`:'');

    <div class="rt-sec in">${routes.length} route${routes.length!==1?'s':''} · ranked by ₹ per bank point</div>`;
  if(!routes.length) h+=`<div class="rt-note">No route from your cards${RT.hops?'':' (try turning hops on)'}.</div>`;
  routes.forEach((p,i)=>{ h+=`<div class="rt-row"><div class="rt-rank">${i+1}</div><div class="rt-path">${rtPathHtml(p)}<div class="rt-sub">${p.edges.length>1?p.edges.length+' transfers · ':''}${rtNotes(p)}</div></div><div class="rt-val"><b>₹${p.value.toFixed(2)}</b><small>1k → ${fmt(p.ratio*1000)}</small></div></div>`; });
  el.innerHTML=h+'</div>';
}

function rtBindGestures(){
  const svg=document.getElementById('rt-svg'), pts=new Map(); let start=null, pinch=null;
  const scale=()=>{ const r=svg.getBoundingClientRect(); return Math.min(r.width,r.height)/1000; };
  const toSvg=(cx,cy)=>{ const r=svg.getBoundingClientRect(), s=scale(); return [(cx-r.left-(r.width-1000*s)/2)/s,(cy-r.top-(r.height-1000*s)/2)/s]; };
  const zoomAt=(sx,sy,f)=>{ const t=RT.tf, k=Math.max(0.6,Math.min(5,t.k*f)); f=k/t.k; t.x=sx-(sx-t.x)*f; t.y=sy-(sy-t.y)*f; t.k=k; rtApplyTf(); };
  svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1) start={x:e.clientX,y:e.clientY,t:Date.now(),tx:RT.tf.x,ty:RT.tf.y,tgt:e.target,moved:false};
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),k:RT.tf.k}; if(start) start.moved=true; } });
  svg.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2&&pinch){ const [a,b]=[...pts.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]); const [sx,sy]=toSvg((a[0]+b[0])/2,(a[1]+b[1])/2); zoomAt(sx,sy,(pinch.k*d/pinch.d)/RT.tf.k); return; }
    if(pts.size===1&&start){ const dx=e.clientX-start.x, dy=e.clientY-start.y; if(Math.hypot(dx,dy)>6) start.moved=true;
      if(start.moved){ const s=scale(); RT.tf.x=start.tx+dx/s; RT.tf.y=start.ty+dy/s; rtApplyTf(); } } });
  const end=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null;
    if(pts.size===0&&start){ if(!start.moved&&Date.now()-start.t<450){ const g=start.tgt.closest&&start.tgt.closest('[data-id]'); if(g) rtSelect(g.dataset.id); else if(RT.sel){ RT.sel=null; rtApplySel(); rtPanel(); } } start=null; } };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  svg.addEventListener('wheel',e=>{ e.preventDefault(); const [sx,sy]=toSvg(e.clientX,e.clientY); zoomAt(sx,sy,e.deltaY<0?1.12:1/1.12); },{passive:false});
}

// compact transfer table for the AI system prompt
function txPromptTable(){
  const V=getVals();
  const cur=TX_CUR.map(c=>`${c.name} [${c.cards}] (${c.note}): `+TX_EDGES.filter(e=>e.f===c.id).map(e=>`${TX_NAME(e.t)} ${ratioLbl(e)}${e.g?' G'+e.g:''}${e.st==='intro'?' intro':''}`).join(', ')).join('\n');
  const hops='Program hops: '+[...new Set(TX_EDGES.filter(e=>e.hop).map(e=>`${TX_NAME(e.f)}→${TX_NAME(e.t)} ${ratioLbl(e)}`))].join(', ');
  const vals='₹/pt values: '+TX_PROG.map(p=>`${p.short} ${V[p.id]}${p.anchor?'*':''}`).join(', ')+' (*=user anchor)';
  return cur+'\n'+hops+'\n'+vals;
}

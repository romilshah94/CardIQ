  ['ph',/portal hotel|hopper hotel|smartbuy hotel|travel with points.*hotel|hotel.*(portal|hopper|smartbuy)|hotels? abroad/],
  ['pf',/portal flight|hopper flight|smartbuy flight|flight.*(portal|hopper|smartbuy)|book (a )?flight/],
  ['ai',/air ?india.*(book|ticket|direct|pay|fare|card)|(book|ticket|pay|card).*air ?india|airindia\.com/],
  ['af',/airline|direct flight|flight direct|indigo ticket|vistara|emirates ticket/],
  ['hd',/hotel direct|direct hotel|hotel booking|marriott\.com|hotel bill|taj|stay/],
  ['gg',/getyourguide|gyg/],
  ['kl',/klook|tour|activit|attraction|4722/],
  ['vc',/voucher|gyftr|amazon|shopwise|gift card/],
  ['ut',/utilit|electric|bill|insurance|broadband|mobile recharge|rent/],
  ['fu',/fuel|petrol|diesel/],
  ['dn',/dining|restaurant|swiggy|zomato|food|eat/],
  ['atm',/atm|cash withdraw|withdraw cash/],
  ['gf',/forex|foreign|international|abroad|usd|sgd|eur|gbp|aed|thb|overseas spend|currency/],
  ['is',/shopping|flipkart|myntra|grocer|online|general spend|everyday|inr spend/],
];
const CARD_KW=[['pr',/premier/],['to',/travel ?one/],['aa',/atlas/],['dc',/dcb|diners|black metal/],['ap',/plat(inum)? charge|charge card/],['pt',/plat(inum)? travel/],['mr',/mrcc|membership rewards/]];
function numIn(q){ const m=q.match(/(\d+(?:\.\d+)?)\s*(k|l|lakh|lac)?\b/); if(!m) return null; let n=parseFloat(m[1]); const u=m[2]; if(u==='k') n*=1e3; if(u&&u.startsWith('l')) n*=1e5; return n; }
function findProg(q){
  const syn={avios:'QR',qatar:'QR',krisflyer:'SQ',singapore:'SQ','flying blue':'AF',bonvoy:'MAR',marriott:'MAR',accor:'ACC',hilton:'HH',ihg:'IHG',aeroplan:'AC',united:'UA',turkish:'TK',etihad:'EY',jal:'JL','asia miles':'CX',cathay:'CX','british airways':'BA',finnair:'AY','air india':'AI',maharaja:'AI',virgin:'VS',wyndham:'WY',qantas:'QF',thai:'TG'};
  for(const [k,id] of Object.entries(syn)) if(q.includes(k)){ const p=TX_PROG.find(x=>x.id===id); if(p) return p; }
  return TX_PROG.find(p=>q.includes(p.name.toLowerCase())||q.includes(p.short.toLowerCase()));
}
function findCur(q){ return TX_CUR.find(c=>q.includes(c.short.toLowerCase())||(c.id==='AM'&&/amex|\bmr\b/.test(q))||(c.id==='HD'&&/hdfc|dcb/.test(q))||(c.id==='AX'&&/axis|atlas|edge/.test(q))||(c.id==='HS'&&/hsbc|premier|travel ?one/.test(q))); }
const goBtn=(l,s)=>({l,fn:`toggleChat();go('${s}')`});
function reply(raw){
  const q=raw.toLowerCase(), n=numIn(q);
  const strip=h=>String(h).replace(/<br\s*\/?>/g,' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  const wantsCard=/which card|what card|best card|card for|use for|pay for|paying|spend on|book/.test(q);

  // 1 · milestone status
  if(/milestone|quarter|fee waiver|progress|how much (more|left)|status/.test(q) && !/route|transfer/.test(q)){
    const rows=MS_DEFS.map(d=>{ const e=msEffRate(d); return d.type==='transaction'
      ? `| ${d.card} ${d.name} | ${MS[d.id]}/4 txns | ${e.done?'Done':'+'+e.boost.toFixed(0)+'%'} | ${daysLeft(d.deadline)}d |`
      : `| ${d.card} ${d.name} | ${lakhs(MS[d.id])} / ${lakhs(d.threshold)} | ${e.done?'Done':e.rate.toFixed(1)+'%'} | ${daysLeft(d.deadline)}d |`; }).join('\n');
    const d=MS_DEFS[0], e=msEffRate(d);
    return {md:`**${e.done?'DCB quarter done.':`${lakhs(msRemaining(d))} left on the DCB quarter`}**${e.done?'':` earns ${e.rate.toFixed(1)}% on each rupee until ${d.deadline}.`}\n\n| Milestone | Progress | Eff. | Left |\n|---|---|---|---|\n${rows}\n\nUpdate spend on the Goals screen and every answer here uses it.`, act:[goBtn('Open Goals','miles')]};
  }
  // 2 · caps
  if(/\bcaps?\b|limit|maxed|ceiling/.test(q)){
    return {md:`**Active caps**\n- HSBC Hopper: **18,000 pts/month**, shared Premier + TravelOne, hotels + flights\n- Axis Atlas Group A: **30,000 EM/yr**, resets 1 Jan (${daysLeft('2026-12-31')} days)\n- Axis Atlas Group B: **1.2L EM/yr** (Miles & More has its own 2L)\n- DCB SmartBuy: **10,000 RP/month**, voucher sub-cap 3,000\n- Amex Plat Charge fuel: **5,000 MR/month**`, act:[goBtn('Open Strategy','optimize')]};
  }
  // 3 · news
  if(/news|devalu|changed|latest|update|what.?s new/.test(q)){
    return {md:`**Recent changes (to ${DATA_ASOF})**\n`+NEWS.slice(0,5).map(x=>`- **${x.title}** (${x.date}). ${strip(x.summary).split('. ')[0]}.`).join('\n'), act:[goBtn('Open News','news')]};
  }
  // 4 · routes to a programme (optionally with target amount / source)
  const prog=findProg(q);
  const routeIntent=/route|transfer|get to|reach|path|move|convert|points to|miles to|how many|avios|from (hdfc|axis|hsbc|amex)/.test(q) || (prog && !wantsCard);
  if(prog && routeIntent){
    const cur=findCur(q.replace(prog.name.toLowerCase(),''));
    let r=[]; (cur?[cur]:TX_CUR).forEach(c=>txPaths(c.id).filter(p=>p.to===prog.id).forEach(p=>r.push(p)));
    r=txPrune(r).sort((a,b)=>b.value-a.value).slice(0,5);
    if(!r.length) return {md:`No route to **${prog.name}**${cur?' from '+cur.name:''} in your stack.`, act:[goBtn('Open Routes','routes')]};
    const tgt=n&&n>=1000?n:null;
    const rows=r.map(p=>`| ${TX_NAME(p.from)} → ${p.edges.map(e=>`${ratioLbl(e)} ${TX_NAME(e.t)}`).join(' → ')} | ₹${p.value.toFixed(2)} |${tgt?` ${Math.ceil(tgt/p.ratio).toLocaleString('en-IN')} |`:''}`).join('\n');
    const notes=[...new Set(r.flatMap(p=>p.edges.map(e=>e.g==='A'?'Group A routes burn the 30k/yr Axis cap':e.tat?`${TX_NAME(e.t)} TAT ${e.tat}`:'').filter(Boolean)))].slice(0,3);
    return {md:`**Best way to ${prog.name}${tgt?` (${tgt.toLocaleString('en-IN')})`:''}:** ${TX_NAME(r[0].from)} → ${r[0].edges.map(e=>TX_NAME(e.t)).join(' → ')}, worth ₹${r[0].value.toFixed(2)} per bank point.\n\n| Route | ₹/pt |${tgt?' Bank pts |':''}\n|---|---|${tgt?'---|':''}\n${rows}${notes.length?'\n\n'+notes.map(x=>'- '+x).join('\n'):''}`, act:[{l:'Show on map',fn:`toggleChat();go('routes');setTimeout(()=>rtSelect('${prog.id}'),420)`}]};
  }
  // 5 · card question ("what does Atlas earn")
  const ck=CARD_KW.find(([,re])=>re.test(q));
  const card=ck&&CARDS.find(c=>c.id===ck[0]);
  // 6 · category routing
  const cat=(CAT_KW.find(([,re])=>re.test(q))||[])[0];
  if(cat){
    const c=CATS.find(x=>x.id===cat);
    let md=`**${c.n} → ${c.best}**${c.rv>0?`, ${c.rv}% return`:''}\n${c.bsub}.\n\n${strip(c.why)}`;
    if(c.cav) md+=`\n\n*Watch:* ${strip(c.cav)}`;
    if(c.alts&&c.alts.length) md+=`\n\n**Next best**\n`+c.alts.map(a=>`- ${a.l}: ${a.r} (${a.n})`).join('\n');
    if(n&&n>=100&&c.rv>0) md+=`\n\nOn ₹${n.toLocaleString('en-IN')}: about **₹${Math.round(n*c.rv/100).toLocaleString('en-IN')}** in value.`;
    return {md, act:[{l:'Open with amount',fn:`toggleChat();openCat('${cat}')${n?`;setTimeout(()=>{const i=document.getElementById('amtinp');if(i){i.value=${n};onAmt('${cat}',${n})}},300)`:''}`}]};
  }
  if(card){
    return {md:`**${card.name}** · ${card.iss}\n\n| Spend | Earn |\n|---|---|\n${card.earn.map(e=>`| ${e.c} | ${e.r} ${e.u} |`).join('\n')}\n\n${strip(card.info).slice(0,420)}`, act:[goBtn('Open Cards','cards')]};
  }
  if(/group a|30.?k/.test(q)) return {md:`**Axis Group A** (30,000 EM/yr, resets 1 Jan, ${daysLeft('2026-12-31')} days): KrisFlyer, JAL, Flying Blue, Air India, Aeroplan, United, Turkish at 1:2. Avoid Accor, BA, Qatar, Asia Miles and Finnair at 2:1.`, act:[goBtn('Open Routes','routes')]};
  if(prog) return reply('route to '+prog.name);
  // fallback
  return {md:`Not sure what you meant. Here is the routing cheat sheet:\n- Portal hotels → **Premier Hopper** (75.6%)\n- Portal flights → **Premier Hopper** (37.8%)\n- Air India → **Plat Charge Xcelerator** (17.5%)\n- Direct airline / hotel → **Atlas** (16%)\n- Vouchers → **DCB GYFTR** (~10%)\n- General INR → **Premier** 6.3% or DCB with milestone\n- Forex → **Premier** (~5.1%)\n- Overseas ATM → **IDFC WOW**\n\nTry "which card for Klook", "route to Qatar", or "milestone status".`, act:[goBtn('Browse categories','spend')]};
}

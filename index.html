<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Card IQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070714;--s0:rgba(255,255,255,.035);--s1:rgba(255,255,255,.06);
  --bd:rgba(110,130,220,.12);--bd2:rgba(110,130,220,.22);
  --accent:#38BDF8;--accentd:rgba(56,189,248,.14);--accentd2:rgba(56,189,248,.28);
  --gold:#FBBF24;--goldd:rgba(251,191,36,.13);--goldd2:rgba(251,191,36,.22);
  --green:#10B981;--greend:rgba(16,185,129,.14);--greend2:rgba(16,185,129,.24);
  --red:#F87171;--redd:rgba(248,113,113,.13);
  --amber:#FB923C;--purple:#A78BFA;--purpled:rgba(167,139,250,.14);
  --text:#EEF0F8;--text2:#A8B0C8;--muted:#555870;
  --r:14px;--safe-t:env(safe-area-inset-top,44px);--safe-b:env(safe-area-inset-bottom,34px);
  --nav:54px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Syne',sans-serif;background:var(--ink);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column;position:relative}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 55% 35% at 10% 8%,rgba(56,189,248,.07) 0%,transparent 70%),radial-gradient(ellipse 45% 35% at 90% 92%,rgba(251,191,36,.05) 0%,transparent 70%)}

/* header */
.hdr{flex-shrink:0;padding:calc(var(--safe-t) + 8px) 20px 13px;border-bottom:1px solid var(--bd);background:rgba(7,7,20,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);position:relative;z-index:20}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between}
.wordmark{font-size:25px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.wordmark em{color:var(--accent);font-style:normal}
.hdr-sub{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:500}
.live-chip{display:flex;align-items:center;gap:5px;background:var(--greend2);border:1px solid rgba(16,185,129,.35);border-radius:20px;padding:5px 10px;font-size:10.5px;font-weight:700;color:var(--green);letter-spacing:.6px;text-transform:uppercase}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulselive 2s ease-in-out infinite}
@keyframes pulselive{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}

/* screens */
.screens{flex:1;overflow:hidden;position:relative;z-index:1}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:16px 16px calc(var(--nav) + var(--safe-b) + 20px);display:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block;animation:scrin .22s ease both}
@keyframes scrin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
/* chat now in floating panel, no screen needed */

/* nav — 7 tabs, label only on active */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:5px 0 calc(var(--safe-b) + 3px);background:rgba(7,7,20,.9);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-top:1px solid var(--bd);display:flex}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border:none;background:none;cursor:pointer;color:var(--muted);transition:color .18s;font-family:'Syne',sans-serif}
.ntab.on{color:var(--accent)}
.ntab-icon{font-size:18px;line-height:1}
.ntab-lbl{display:none;font-size:8.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.ntab.on .ntab-lbl{display:block}

/* shared */
.stitle{font-size:21px;font-weight:800;letter-spacing:-.5px;margin-bottom:13px;line-height:1.1}
.gcard{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:9px}
.notice{border-radius:10px;padding:9px 13px;font-size:12.5px;line-height:1.5;margin-bottom:13px}
.n-green{background:var(--greend);border:1px solid rgba(16,185,129,.25);color:#6EE7B7}
.n-gold{background:var(--goldd);border:1px solid rgba(251,191,36,.25);color:#FCD34D}
/* ── FLOATING CHAT ── */
.chat-fab{position:fixed;bottom:calc(var(--nav) + var(--safe-b) + 12px);right:16px;z-index:150;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#1360A0,#38BDF8);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(56,189,248,.35);transition:transform .15s}
.chat-fab:active{transform:scale(.92)}
.chat-fab svg{width:22px;height:22px;fill:white}
.chat-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:160;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.chat-backdrop.on{display:block}
.chat-panel{position:fixed;bottom:0;left:0;right:0;z-index:170;background:var(--ink2);border-top:1px solid var(--bd);border-radius:20px 20px 0 0;display:flex;flex-direction:column;height:72vh;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
.chat-panel.on{transform:translateY(0)}
.chat-panel-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.chat-panel-title{font-size:15px;font-weight:800;letter-spacing:-.3px}
.chat-close{background:var(--s1);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center}
.chat-msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.chat-msgs::-webkit-scrollbar{display:none}
.chat-input-row{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(var(--safe-b) + 8px);border-top:1px solid var(--bd);flex-shrink:0;background:rgba(7,7,20,.92)}
.chatinput{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:9px 15px;font-size:14px;font-family:'Syne',sans-serif;color:var(--text);outline:none;resize:none;max-height:80px;min-height:38px;line-height:1.4}
.chatinput::placeholder{color:var(--muted)}
.sendbtn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#1360A0,#38BDF8);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 3px 12px rgba(56,189,248,.3)}
.sendbtn svg{width:15px;height:15px;fill:#fff}
.chip{background:var(--s0);border:1px solid var(--bd);border-radius:16px;padding:6px 12px;font-size:12px;font-weight:600;font-family:'Syne',sans-serif;white-space:nowrap;cursor:pointer;color:var(--text2);transition:all .14s;flex-shrink:0}
.chip:active{background:var(--accentd);border-color:var(--accentd2);color:var(--accent);transform:scale(.95)}
.chatlist{display:flex;flex-direction:column;gap:10px}
.mbot{align-self:flex-start;max-width:92%}.muser{align-self:flex-end;max-width:82%}
.mbub{padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.6}
.mbot .mbub{background:var(--s1);border:1px solid var(--bd);border-bottom-left-radius:4px}
.muser .mbub{background:linear-gradient(135deg,#1360A0,#38BDF8);color:#fff;border-bottom-right-radius:4px}
.mtime{font-size:10px;color:var(--muted);padding:2px 6px;font-family:'JetBrains Mono',monospace}
.muser .mtime{text-align:right}
.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin:0 2px;animation:tdot 1s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.14s}.typing span:nth-child(3){animation-delay:.28s}
@keyframes tdot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-4px);opacity:1}}

/* ── SPEND ── */
.cat-scroll{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.cat-scroll::-webkit-scrollbar{display:none}
.catbtn{background:var(--s0);border:1.5px solid var(--bd);border-radius:20px;padding:8px 13px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:all .15s;-webkit-user-select:none;white-space:nowrap;flex-shrink:0}
.catbtn:active{transform:scale(.96)}
.catbtn.sel{background:var(--accentd);border-color:rgba(56,189,248,.5)}
.cat-e{font-size:17px;line-height:1}.cat-n{font-size:12.5px;font-weight:700}
.cbadge{background:var(--greend);color:var(--green);font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;text-transform:uppercase;margin-left:2px}
.cbadge.cbw{background:var(--goldd);color:var(--gold)}

.rslide{animation:rslide .22s ease both}
@keyframes rslide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rhero{border-radius:var(--r);padding:2px;margin-bottom:9px;background:linear-gradient(135deg,rgba(56,189,248,.45),rgba(56,189,248,.08) 45%,rgba(251,191,36,.3))}
.rhero-in{background:rgba(9,9,22,.92);border-radius:calc(var(--r) - 2px);padding:17px}
.rtag{font-size:9.5px;font-weight:800;color:var(--accent);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px}
.rname{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.rsub{font-size:11.5px;color:var(--muted);margin-bottom:13px;margin-top:3px;font-weight:500}
.rretrow{display:flex;align-items:flex-end;gap:11px;margin-bottom:12px}
.rnum{font-family:'JetBrains Mono',monospace;font-size:54px;font-weight:700;line-height:1}
.rnum.ng{color:var(--green);text-shadow:0 0 28px rgba(16,185,129,.6)}
.rnum.nb{color:var(--accent);text-shadow:0 0 28px rgba(56,189,248,.6)}
.rnum.na{color:var(--gold);text-shadow:0 0 28px rgba(251,191,36,.5)}
.rlbl{font-size:12px;color:var(--muted);padding-bottom:5px;font-weight:500;line-height:1.4}
.rreason{font-size:13px;color:var(--text2);line-height:1.65;background:var(--s0);border-radius:9px;padding:10px 12px}
.rcaveat{font-size:12px;color:var(--gold);line-height:1.55;background:var(--goldd);border-radius:9px;padding:9px 12px;margin-top:7px;display:flex;gap:7px;align-items:flex-start}
.alts-hd{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:7px;margin-top:2px}
.altrow{background:var(--s0);border:1px solid var(--bd);border-radius:11px;padding:11px 13px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.altname{font-size:13.5px;font-weight:700}.altnote{font-size:11px;color:var(--muted);margin-top:2px}
.altrate{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap}

/* amount input + dynamic recommender */
.amt-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.amt-label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.amt-input{flex:1;background:var(--s1);border:1px solid var(--bd2);border-radius:10px;padding:9px 12px;font-size:15px;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text);outline:none;width:100%}
.amt-input::placeholder{color:var(--muted);font-family:'Syne',sans-serif;font-size:13px;font-weight:400}
.amt-input:focus{border-color:var(--accent)}
.dynrec{margin-top:4px;animation:rslide .2s ease both}
.dynrec-hd{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.rec-row{
  background:var(--s0);border:1px solid var(--bd);border-radius:12px;
  padding:11px 13px;margin-bottom:6px;
  display:flex;align-items:center;gap:10px;
}
.rec-row.winner{background:var(--greend);border-color:rgba(16,185,129,.3)}
.rec-rank{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);width:20px;flex-shrink:0}
.rec-info{flex:1;min-width:0}
.rec-card{font-size:13.5px;font-weight:700}
.rec-note{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.rec-boost{font-size:11px;color:var(--green);font-weight:700;margin-top:2px}
.rec-rate{text-align:right;flex-shrink:0}
.rec-pct{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700}
.rec-pct.top{color:var(--green);text-shadow:0 0 14px rgba(16,185,129,.5)}
.rec-pct.hi{color:var(--green)}
.rec-pct.md{color:var(--gold)}
.rec-pct.lo{color:var(--amber)}
.ms-tag{display:inline-block;background:var(--goldd2);color:var(--gold);font-size:9px;font-weight:800;padding:2px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.4px;margin-left:4px;vertical-align:middle}

/* ── MILESTONES TAB ── */
.ms-card{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:15px;margin-bottom:10px;position:relative}
.ms-card.done{border-color:rgba(16,185,129,.3);background:var(--greend)}
.ms-card.urgent{border-color:rgba(251,191,36,.3)}
.ms-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
.ms-card-name{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.ms-name{font-size:15px;font-weight:800;line-height:1.2}
.ms-period{font-size:11px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono',monospace}
.ms-eff-rate{text-align:right;flex-shrink:0}
.ms-eff-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.ms-eff-num{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;line-height:1;margin-top:2px}
.ms-eff-num.boosted{color:var(--green);text-shadow:0 0 16px rgba(16,185,129,.5)}
.ms-eff-num.base{color:var(--accent)}
.ms-eff-num.done-c{color:var(--muted)}

/* progress bar */
.ms-prog-wrap{margin-bottom:10px}
.ms-prog-labels{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
.ms-prog-spent{color:var(--text2);font-family:'JetBrains Mono',monospace;font-weight:600}
.ms-prog-thresh{color:var(--muted);font-family:'JetBrains Mono',monospace}
.ms-bar{height:4px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.ms-fill{height:100%;border-radius:3px;transition:width .4s ease}

/* input row */
.ms-input-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ms-input-lbl{font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:600}
.ms-input{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font-size:13px;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text);outline:none}
.ms-input:focus{border-color:var(--accent)}
.ms-txn-btns{display:flex;gap:6px;align-items:center}
.txn-btn{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:6px 14px;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;transition:all .12s;font-family:'Syne',sans-serif}
.txn-btn:active{background:var(--accentd)}

/* breakdown */
.ms-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.ms-bk{background:rgba(255,255,255,.025);border-radius:9px;padding:9px 10px}
.ms-bk-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.ms-bk-val{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700}
.ms-bk-val.g{color:var(--green)}.ms-bk-val.b{color:var(--accent)}.ms-bk-val.o{color:var(--gold)}.ms-bk-val.r{color:var(--red)}

/* deadline tag */
.ms-deadline{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.ms-dl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ms-done-badge{background:var(--greend);color:var(--green);border:1px solid rgba(16,185,129,.35);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;display:inline-flex;align-items:center;gap:4px}

/* txn progress (MRCC) */
.txn-pips{display:flex;gap:8px;margin-bottom:10px}
.txn-pip{width:36px;height:36px;border-radius:8px;background:var(--s1);border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .15s}
.txn-pip.done{background:var(--greend);border-color:rgba(16,185,129,.4)}

/* ── CARDS ── */
.ccard-row{display:flex;gap:12px;align-items:center;padding:13px 15px;cursor:pointer}
.ccard-art{width:116px;height:72px;border-radius:8px;flex-shrink:0;position:relative;overflow:hidden}
.ccard-art-inner{position:absolute;inset:0;padding:9px 11px;display:flex;flex-direction:column;justify-content:space-between}
.ccard-chip{width:18px;height:13px;background:rgba(255,255,255,.28);border-radius:2px}
.ccard-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.3px;text-shadow:0 1px 3px rgba(0,0,0,.6);line-height:1.3}
.ccard-iss{font-size:8px;color:rgba(255,255,255,.5)}
.ctext{flex:1;min-width:0}.cname{font-size:14.5px;font-weight:700}.ciss{font-size:11.5px;color:var(--muted);margin-top:2px}
.cchev{color:var(--muted);font-size:17px;transition:transform .2s;flex-shrink:0}
.cchev.op{transform:rotate(90deg)}
.cdet{padding:0 15px 13px;display:none}.cdet.op{display:block}
.primary-badge{display:inline-flex;align-items:center;gap:5px;background:var(--greend2);border:1px solid rgba(16,185,129,.35);border-radius:6px;padding:4px 9px;font-size:10px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.tag{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.tb{background:var(--accentd);color:var(--accent)}.tg{background:var(--greend);color:var(--green)}.to{background:var(--goldd);color:var(--gold)}.tr{background:var(--redd);color:var(--red)}.tp{background:var(--purpled);color:var(--purple)}.tl{background:var(--greend2);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.earns{margin-bottom:11px}
.erow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);gap:8px}
.erow:last-child{border-bottom:none}
.ecat{font-size:12px;color:var(--text2);flex:1;line-height:1.35}
.erate{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700;color:var(--accent);white-space:nowrap}
.eunit{font-size:10.5px;color:var(--muted);white-space:nowrap}
.infobox{background:rgba(255,255,255,.025);border:1px solid var(--bd);border-radius:9px;padding:11px 13px;font-size:12.5px;color:var(--text2);line-height:1.7}
.ig{color:var(--green);font-weight:700}.iw{color:var(--red);font-weight:700}.io{color:var(--gold);font-weight:700}.ia{color:var(--accent);font-weight:700}

/* ── OPTIMIZE ── */
.opthero{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:17px;margin-bottom:11px}
.opthd{font-size:15px;font-weight:800;margin-bottom:13px}
.rtrow{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}
.rtrow:last-child{border-bottom:none}
.rtspend{font-size:12.5px;color:var(--text2);flex:1;line-height:1.3}.rtcard{font-size:10.5px;color:var(--muted)}
.rtval{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;white-space:nowrap}
.rtval.top{color:var(--green);font-size:20px}.rtval.hi{color:var(--green)}.rtval.md{color:var(--gold)}.rtval.lo{color:var(--amber)}
.newtag{background:var(--greend);color:var(--green);font-size:8.5px;font-weight:800;padding:2px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.4px;vertical-align:middle;margin-left:3px}
.valrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}
.valrow:last-child{border-bottom:none}

/* ── NEWS ── */

.tier-target{font-family:'JetBrains Mono',monospace}

.lbd{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.lbd-cell{background:rgba(255,255,255,.025);border-radius:8px;padding:8px 10px}

.lbd-val{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700}
.lbd-val.g{color:var(--green)}.lbd-val.b{color:var(--accent)}.lbd-val.o{color:var(--gold)}.lbd-val.p{color:var(--purple)}

.lperk-row{display:flex;gap:6px;align-items:baseline}
.hot-offer-bar{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--gold);line-height:1.5;margin-top:6px}
/* ── CHAT ── */
.chiprow{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:11px}
.chiprow::-webkit-scrollbar{display:none}
.chip{background:var(--s0);border:1px solid var(--bd);border-radius:16px;padding:7px 13px;font-size:12px;font-weight:600;font-family:'Syne',sans-serif;white-space:nowrap;cursor:pointer;color:var(--text2);transition:all .14s;flex-shrink:0}
.chip:active{background:var(--accentd);border-color:var(--accentd2);color:var(--accent);transform:scale(.95)}
.chatlist{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.mbot{align-self:flex-start;max-width:92%}.muser{align-self:flex-end;max-width:82%}
.mbub{padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.6}
.mbot .mbub{background:var(--s1);border:1px solid var(--bd);border-bottom-left-radius:4px}
.muser .mbub{background:linear-gradient(135deg,#1360A0,#38BDF8);color:#fff;border-bottom-right-radius:4px}
.mtime{font-size:10px;color:var(--muted);padding:2px 6px;font-family:'JetBrains Mono',monospace}
.muser .mtime{text-align:right}
.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin:0 2px;animation:tdot 1s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.14s}.typing span:nth-child(3){animation-delay:.28s}
@keyframes tdot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-4px);opacity:1}}

/* ── API KEY MODAL ── */
.apimodal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.apimodal-bg.on{display:flex}
.apimodal{background:#0D0D1F;border:1px solid var(--bd2);border-radius:20px;padding:24px;width:100%;max-width:380px}
.apimodal-title{font-size:17px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px}
.apimodal-sub{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:15px}
.apimodal-input{width:100%;background:var(--s1);border:1px solid var(--bd2);border-radius:10px;padding:10px 13px;font-size:13.5px;font-family:'JetBrains Mono',monospace;color:var(--text);outline:none;margin-bottom:10px;-webkit-text-security:disc}
.apimodal-input:focus{border-color:var(--accent)}
.apimodal-btn{width:100%;background:linear-gradient(135deg,#1360A0,#38BDF8);border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;margin-bottom:8px;font-family:'Syne',sans-serif}
.apimodal-skip{width:100%;background:none;border:1px solid var(--bd);border-radius:10px;padding:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Syne',sans-serif}
/* key icon button in chat header */
.key-icon-btn{background:var(--s1);border:1px solid var(--bd);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .15s}
.key-icon-btn:active{border-color:var(--accent)}
/* ── GMAIL SCAN ── */
.gmail-scan-btn{display:flex;align-items:center;gap:10px;background:var(--s0);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:13px;cursor:pointer;transition:border-color .15s;width:100%;font-family:'Syne',sans-serif;text-align:left}
.gmail-scan-btn:active{border-color:var(--accentd2);background:var(--accentd)}
.gmail-scan-icon{font-size:22px;flex-shrink:0}
.gmail-scan-text{flex:1}
.gmail-scan-title{font-size:13.5px;font-weight:700;color:var(--text)}
.gmail-scan-sub{font-size:11px;color:var(--muted);margin-top:2px}
.gmail-sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}

.gmail-sheet-close{background:var(--s1);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center}
.gmail-sheet-body{flex:1;overflow-y:auto;padding:12px 16px 4px}

.txn-item{background:var(--s0);border:1px solid var(--bd);border-radius:10px;padding:10px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px}

.rec-pts{font-size:10px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono',monospace;text-align:right;white-space:nowrap}
/* ── CARD ART — network logo + image ── */
.ccard-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px}

</style>
</head>

// Live milestone state (user-editable, in-memory)
const MS = {};
MS_DEFS.forEach(m => { MS[m.id] = m.type === 'transaction' ? (m.defaultSpend || 0) : (m.defaultSpend || 0); });

// Milestone math
function msRemaining(def) {
  const cur = MS[def.id];
  return Math.max(0, def.threshold - cur);
}
function msBoost(def) {
  const rem = msRemaining(def);
  if (rem <= 0 || def.type === 'transaction') return 0;
  return (def.rewardValue / rem) * 100;
}
function msEffRate(def) {
  if (def.type === 'transaction') {
    const done = MS[def.id];
    if (done >= 4) return { rate: def.baseRate, boost: 0, done: true };
    const rem = 4 - done;
    const boostPerTxn = (def.rewardValue / (rem * def.txnMin)) * 100;
    return { rate: def.baseRate + boostPerTxn, boost: boostPerTxn, done: false };
  }
  const boost = msBoost(def);
  const done = msRemaining(def) <= 0;
  return { rate: done ? def.baseRate : def.baseRate + boost, boost, done };
}
function pct(n) { return n > 0 ? n.toFixed(1) + '%' : '—'; }
function lakhs(n) {
  if (n >= 100000) return '₹' + (n/100000).toFixed(2) + 'L';
  if (n >= 1000) return '₹' + (n/1000).toFixed(0) + 'k';
  return '₹' + n;
}
function daysLeft(deadline) {
  const d = Math.ceil((new Date(deadline) - new Date()) / 86400000);
  return d;
}

        boost: dcbEff.done ? 0 : dcbEff.boost,
        boostNote: dcbEff.done ? '✅ Quarterly milestone complete' : `Quarterly: ${lakhs(msRemaining(dcbDef))} remaining → ₹${(dcbDef.rewardValue/1000).toFixed(0)}k bonus`,
        cls: dcbEff.rate > 10 ? 'hi' : dcbEff.rate > 6 ? 'md' : 'lo'
      },
      { card:'Axis Atlas (online MCCs)', rate:3.2, note:'2 EM/₹100 → KrisFlyer at ₹0.8 CPP est.', cls:'lo' },
      { card:'MRCC Monthly Bonus', rate:mrccEff.rate, note:`${MS[mrccDef.id]}/4 txns done · ${mrccEff.done?'Bonus earned!':'₹1,500 bonus on completing 4 txns'}`, boost:mrccEff.done?0:mrccEff.boost, boostNote:mrccEff.done?'✅ Monthly bonus achieved':`+${mrccEff.boost.toFixed(0)}% boost per ₹1,500+ qualifying transaction`, cls:mrccEff.done?'lo':mrccEff.rate>20?'top':'md' },
    ];
  } else if(Array.isArray(cat.dynCards)){
    rows = cat.dynCards.map(r=>({...r, rate:r.rate}));
  } else {
    document.getElementById('dynrec').innerHTML='';
    return;
  }

  rows.sort((a,b)=>b.rate-a.rate);

  let rhtml = `<div class="dynrec"><div class="dynrec-hd">Effective return on ${lakhs(amt)}</div>`;
  rows.forEach((r,i)=>{
    const cls = i===0 ? 'top' : r.cls||'lo';
    const pctStr = r.special || (r.rate>0 ? r.rate.toFixed(1)+'%' : '—');
    const rupeeVal = r.rate>0 ? Math.round(r.rate/100*amt) : 0;
    const ptsEarned = r.ptsRate ? Math.round(r.ptsRate*amt/100) : null;
    const topVal = ptsEarned ? `${ptsEarned.toLocaleString('en-IN')} ${r.ptsProg}` : pctStr;
    const subVal = ptsEarned ? `${pctStr} · ₹${rupeeVal.toLocaleString('en-IN')}` : (rupeeVal>0?`₹${rupeeVal.toLocaleString('en-IN')}`:'');
    rhtml += `<div class="rec-row${i===0?' winner':''}">
      <div class="rec-rank">${i===1?'②':i===2?'③':i===3?'④':'①'}</div>
      <div class="rec-info">
        <div class="rec-card">${r.card}${(r.boost||0)>0?`<span class="ms-tag">milestone</span>`:''}</div>
        <div class="rec-note">${r.note}</div>
        ${(r.boost||0)>0&&r.boostNote?`<div class="rec-boost">⚡ ${r.boostNote}</div>`:''}
      </div>
      <div class="rec-rate">
        <div class="rec-pct ${cls}" style="${ptsEarned?'font-size:13px;line-height:1.2':''}">${topVal}</div>
        ${subVal?`<div class="rec-pts">${subVal}</div>`:''}
      </div>
    </div>`;
  });
  rhtml += '</div>';
  document.getElementById('dynrec').innerHTML = rhtml;
}

function animn(el,target){
  const dur=680,t0=performance.now();
  const run=t=>{const p=Math.min((t-t0)/dur,1),e=1-(1-p)**3;el.textContent=(target*e).toFixed(1)+'%';if(p<1)requestAnimationFrame(run)};
  requestAnimationFrame(run);
}

function updateMs(id, val){
  const n = Math.max(0, parseFloat(val)||0);
  MS[id] = n;
  const def = MS_DEFS.find(m=>m.id===id);
  // re-render breakdown
  const bd = document.getElementById('msbd-'+id);
  if(bd) bd.innerHTML = msBdHtml(def);
  // update progress bar
  const mc = document.getElementById('mc-'+id);
  if(mc){
    const fill = mc.querySelector('.ms-fill');
    if(fill){
      const pct = Math.min(100,(n/def.threshold)*100).toFixed(1);
      const col = pct>75?'var(--green)':pct>40?'var(--gold)':'var(--accent)';
      fill.style.width=pct+'%'; fill.style.background=col;
    }
    const progSpent = mc.querySelector('.ms-prog-spent');
    if(progSpent) progSpent.textContent = lakhs(n) + ' spent';
  }
  // update header rate
  const eff = msEffRate(def);
  const effEl = mc && mc.querySelector('.ms-eff-num');
  if(effEl){ effEl.textContent = eff.done?'✅':eff.rate.toFixed(1)+'%'; effEl.className='ms-eff-num '+(eff.done?'done-c':eff.rate>10?'boosted':'base'); }
  // re-render dynrec if on spend tab
  if(selCatId){
    const inp = document.getElementById('amtinp');
    if(inp && inp.value) renderDyn(selCatId, parseFloat(inp.value));
  }
  // update notice bar
  const notice = document.querySelector('#screen-miles .notice');
  if(notice){ const dcb=MS_DEFS[0]; notice.textContent=`⚡ DCB quarterly cycle ends June 30 — ${daysLeft('2026-06-30')} days left. Effective rate = ${(dcb.baseRate+msBoost(dcb)).toFixed(1)}% on remaining spend.`; }
}

function txnPip(id, count){
  MS[id] = count > MS[id] ? count : count - 1; // toggle
  if(MS[id]<0) MS[id]=0;
  const def = MS_DEFS.find(m=>m.id===id);
  const mc = document.getElementById('mc-'+id);
  // re-render pips
  const pipsEl = document.getElementById('pips-'+id);
  if(pipsEl) pipsEl.innerHTML = Array.from({length:4},(_,i)=>`<div class="txn-pip ${i<MS[id]?'done':''}" onclick="txnPip('${id}',${i+1})">${i<MS[id]?'✓':(i+1)}</div>`).join('');
  // re-render breakdown
  const bd = document.getElementById('msbd-'+id);
  if(bd) bd.innerHTML = msBdHtml(def);
  // update header rate
  const eff = msEffRate(def);
  const effEl = mc && mc.querySelector('.ms-eff-num');
  if(effEl){ effEl.textContent=eff.done?'Done':eff.rate.toFixed(0)+'%'; }
}

function chipq(t){document.getElementById('ci').value=t;send()}
function botmsg(text,typing=false){
  const cl=document.getElementById('cl'),d=document.createElement('div');d.className='mbot';
  if(typing){d.id='typing';d.innerHTML=`<div class="mbub"><span class="typing"><span></span><span></span><span></span></span></div>`}
  else{const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});d.innerHTML=`<div class="mbub">${text}</div><div class="mtime">${t}</div>`}
  cl.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});return d;
}
function usermsg(text){
  const cl=document.getElementById('cl'),d=document.createElement('div');d.className='muser';
  d.innerHTML=`<div class="mbub">${text}</div><div class="mtime">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
  cl.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});
}
async function send(){
  const inp=document.getElementById('ci'),text=inp.value.trim();if(!text)return;
  inp.value='';inp.style.height='auto';usermsg(text);
  const apiKey=localStorage.getItem('ciq_anthropic_key');
  if(!apiKey){
    const t=botmsg('',true);
    setTimeout(()=>{t.remove();botmsg('Tap 🔑 above to add your Anthropic API key for AI answers.<br><br>Cached: '+reply(text));},400);
    return;
  }
  const t=botmsg('',true);
  try{
    const resp=await callClaude(text);
    t.remove();botmsg(resp);
  }catch(err){
    t.remove();
    botmsg('⚠️ '+err.message+'<br><br>Cached: '+reply(text));
  }
}

function filterNews(tag, el){
  activeFilter=tag;
  document.querySelectorAll('.fchip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  NEWS.forEach(n=>{
    const card=document.getElementById('nc-'+n.id);
    if(!card) return;
    const show = tag==='All' || n.tags.includes(tag) || (tag==='Live Offers' && n.hot);
    card.classList.toggle('hidden',!show);
  });
}

function togLoy(id){
  const b=document.getElementById('lb-'+id);
  b.classList.toggle('op');
}

function toggleNum(id){
  const p=PROGRAMS.find(x=>x.id===id);
  const saved=lsGet(p.lsKey,{});
  if(!saved.num) return editLoy(id);
  const el=document.getElementById('an-'+id);
  const showing=el.dataset.showing==='1';
  el.textContent=showing?'••••••••':saved.num;
  el.dataset.showing=showing?'':'1';
  const apEl=document.getElementById('ap-'+id);
  if(apEl&&saved.pin){ apEl.textContent=showing?'••••••••':saved.pin; apEl.dataset.showing=showing?'':'1'; }
}

function editLoy(id){
  const wrap=document.getElementById('ai-'+id);
  const open=wrap.classList.contains('open');
  wrap.classList.toggle('open',!open);
  if(!open){ const inp=document.getElementById('af-num-'+id); if(inp) inp.focus(); }
}

function saveLoy(id){
  const p=PROGRAMS.find(x=>x.id===id);
  const num=document.getElementById('af-num-'+id).value.trim();
  const pin=document.getElementById('af-pin-'+id).value.trim();
  const existing=lsGet(p.lsKey,{});
  lsSet(p.lsKey,{...existing,num,pin});
  // update display
  const el=document.getElementById('an-'+id);
  if(el){ el.textContent=num?'••••••••':'— add number'; el.dataset.showing=''; }
  const apEl=document.getElementById('ap-'+id);
  if(apEl&&pin){ apEl.textContent='••••••••'; apEl.dataset.showing=''; }
  document.getElementById('ai-'+id).classList.remove('open');
}

function updateLoyProg(id,idx,val){
  const p=PROGRAMS.find(x=>x.id===id);
  const saved=lsGet(p.lsKey,{progOverrides:{}});
  if(!saved.progOverrides) saved.progOverrides={};
  saved.progOverrides[idx]=parseFloat(val)||0;
  lsSet(p.lsKey,saved);
  // update bar
  const pr=p.prog[idx];
  const pct=Math.min(100,(saved.progOverrides[idx]/pr.target)*100);
  const bars=document.querySelectorAll(`#lc-${id} .tier-fill`);
  if(bars[idx]) bars[idx].style.width=pct+'%';
  const pcts=document.querySelectorAll(`#lc-${id} .tier-pct`);
  if(pcts[idx]) pcts[idx].textContent=pct.toFixed(0)+'%';
}

async function callClaude(userMsg){
  const key=localStorage.getItem('ciq_anthropic_key');
  if(!key) throw new Error('No API key — tap 🔑 to add');
  chatHistory.push({role:'user',content:userMsg});
  const makeBody=(withSearch)=>({
    model:'claude-haiku-4-5-20251001',
    max_tokens:1024,
    system:buildSystemPrompt(),
    ...(withSearch?{tools:[{type:'web_search_20250305',name:'web_search'}]}:{}),
    messages:chatHistory.slice(-12)
  });
  const doReq=async(body)=>{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify(body)
    });
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||`API ${r.status}`);}
    return r.json();
  };
  let data=await doReq(makeBody(true));
  if(data.stop_reason==='tool_use') data=await doReq(makeBody(false));
  const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')||'…';
  chatHistory.push({role:'assistant',content:text});
  return text;
}

// GMAIL INTEGRATION
// ══════════════════════════════════════════════════════════
let _gmailTxns=[];
let _gsiLoaded=false;
let _tokenClient=null;

function scanGmail(){
  const clientId=localStorage.getItem('ciq_google_client_id');
  if(!clientId){
    showApiModal('ciq_google_client_id','Google Client ID',
      'Create an OAuth 2.0 Client ID at console.cloud.google.com → APIs & Services → Credentials. Enable Gmail API. Add your domain/localhost as authorised origin.',
      'your-client-id.apps.googleusercontent.com',
      ()=>scanGmail());
    return;
  }
  if(!_gsiLoaded||!window.google?.accounts?.oauth2){
    const sub=document.getElementById('gmail-scan-sub');
    if(sub) sub.textContent='Loading Google auth…';
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client';
    s.onload=()=>{ _gsiLoaded=true; _initTokenClient(clientId); };
    s.onerror=()=>{ if(sub) sub.textContent='Failed to load Google auth'; };
    document.head.appendChild(s);
    return;
  }
  _initTokenClient(clientId);
}

function _initTokenClient(clientId){
  _tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:clientId,
    scope:'https://www.googleapis.com/auth/gmail.readonly',
    callback:_handleGToken
  });
  _tokenClient.requestAccessToken({prompt:''});
}

async function _handleGToken(resp){
  const sub=document.getElementById('gmail-scan-sub');
  if(resp.error){ if(sub) sub.textContent='Sign-in failed: '+resp.error; return; }
  if(sub) sub.textContent='Scanning…';
  try{
    await _fetchGmail(resp.access_token);
  }catch(e){
    if(sub) sub.textContent='Scan error: '+e.message;
  }
}

async function _fetchGmail(token){
  const q=encodeURIComponent('(from:(alerts@hdfcbank.net OR infoindia@americanexpress.com OR alerts@axisbank.com OR notify@alerts.hsbc.co.in OR alerts@hsbc.co.in OR txnalert@axisbank.com) OR subject:(spent on your OR debit alert OR credit card transaction)) newer_than:90d');
  const listR=await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${q}&maxResults=75`,{headers:{Authorization:`Bearer ${token}`}});
  if(!listR.ok) throw new Error('Gmail API '+listR.status+' — check Client ID & scopes');
  const list=await listR.json();
  const msgs=list.messages||[];
  const sub=document.getElementById('gmail-scan-sub');
  if(!msgs.length){ if(sub) sub.textContent='No transaction emails found'; return; }
  if(sub) sub.textContent=`Fetching ${msgs.length} emails…`;
  const details=await Promise.all(msgs.slice(0,60).map(m=>
    fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${m.id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`,
      {headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json())
  ));
  _gmailTxns=_parseTxns(details);
  if(sub) sub.textContent=`Found ${_gmailTxns.length} transactions`;
  _showGmailSheet(_gmailTxns);
}

function _parseTxns(emails){
  const out=[];
  for(const e of emails){
    if(!e.payload) continue;
    const hdr=Object.fromEntries((e.payload.headers||[]).map(h=>[h.name,h.value]));
    const subj=hdr.Subject||'', from=hdr.From||'', dateStr=hdr.Date||'';
    const txn=_parseLine(subj,from,new Date(dateStr));
    if(txn) out.push(txn);
  }
  return out.sort((a,b)=>b.date-a.date);
}

function _parseLine(subj,from,date){
  // Match Indian bank alert patterns
  const amtM=subj.match(/(?:INR|Rs\.?|₹)\s*([\d,]+(?:\.\d{1,2})?)/i);
  if(!amtM) return null;
  const amount=parseFloat(amtM[1].replace(/,/g,''));
  if(!amount||amount<1||amount>10000000) return null;

  const src=(from+' '+subj).toLowerCase();
  let card='',cardId='',cardShort='';
  if(/hdfc|diners|dcb/.test(src)){card='DCB Metal';cardId='dcb_q';cardShort='DCB';}
  else if(/mrcc|membership reward/.test(src)){card='Amex MRCC';cardId='mrcc_mo';cardShort='MRCC';}
  else if(/amex|american express|platinum travel/.test(src)){card='Amex Plat Travel';cardId='amex_pt1';cardShort='Amex PT';}
  else if(/amex|american express/.test(src)){card='Amex';cardId='';cardShort='Amex';}
  else if(/hsbc/.test(src)){card='HSBC';cardId='';cardShort='HSBC';}
  else if(/axis/.test(src)){card='Axis';cardId='';cardShort='Axis';}
  else{card='Card';cardId='';cardShort='';}

  const mM=subj.match(/(?:at|merchant[:\s]+|towards)\s+([A-Za-z][A-Za-z0-9\s&'.,-]{2,28}?)(?:\s+on\s+|\s+dated|\s+for\s+|\s*$)/i);
  const merchant=mM?mM[1].trim():'Unknown';
  const cat=_inferCat(merchant);

  return {amount,merchant,card,cardId,cardShort,cat,date,sel:true};
}

function _inferCat(m){
  const s=m.toLowerCase();
  if(/marriott|accor|hilton|hyatt|ihg|sheraton|westin|taj|oberoi|itc hotel/.test(s)) return 'Hotel Direct';
  if(/indigo|air india|spicejet|vistara|airasia|go first/.test(s)) return 'Direct Airline MCC';
  if(/klook/.test(s)) return 'Klook / Tours';
  if(/getyourguide/.test(s)) return 'GetYourGuide';
  if(/amazon|flipkart|myntra|ajio|nykaa|meesho|tata cliq/.test(s)) return 'INR Shopping';
  if(/swiggy|zomato|dominos|mcdonalds|starbucks|café|restaurant|pizza|biryani/.test(s)) return 'Dining';
  return 'INR Shopping';
}

function _showGmailSheet(txns){
  const list=document.getElementById('gmail-txn-list');
  if(!txns.length){list.innerHTML='<div style="text-align:center;color:var(--muted);padding:20px">No transactions parsed</div>';return;}
  list.innerHTML=txns.map((t,i)=>`
    <div class="txn-item${t.sel?' sel':''}" onclick="_toggleTxn(${i})">
      <div class="txn-check${t.sel?' on':''}">${t.sel?'✓':''}</div>
      <div class="txn-info">
        <div class="txn-merchant">${t.merchant}</div>
        <div class="txn-detail">${t.cardShort||t.card} · ${t.cat} · ${t.date.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div>
      </div>
      <div class="txn-amt">₹${t.amount.toLocaleString('en-IN')}</div>
    </div>`).join('');
  document.getElementById('gmail-sheet-bg').classList.add('on');
}

function _toggleTxn(i){
  _gmailTxns[i].sel=!_gmailTxns[i].sel;
  _showGmailSheet(_gmailTxns);
}

function closeGmailSheet(){
  document.getElementById('gmail-sheet-bg').classList.remove('on');
}

function applyGmailTransactions(){
  const sel=_gmailTxns.filter(t=>t.sel&&t.cardId);
  const totals={};
  sel.forEach(t=>{
    if(!totals[t.cardId]) totals[t.cardId]=0;
    totals[t.cardId]+=t.amount;
  });
  Object.entries(totals).forEach(([id,amt])=>{
    const cur=MS[id]||0;
    MS[id]=cur+amt;
    const inp=document.getElementById('msi-'+id);
    if(inp){inp.value=MS[id];updateMs(id,MS[id]);}
  });
  closeGmailSheet();
  const totalAmt=Object.values(totals).reduce((a,b)=>a+b,0);
  const sub=document.getElementById('gmail-scan-sub');
  if(sub) sub.textContent=`Applied ${sel.length} txn${sel.length!==1?'s':''} · ₹${totalAmt.toLocaleString('en-IN')} added`;
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CardIQ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="description" content="CardIQ — personal credit card routing, milestones and transfer-partner map">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>CardIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
/* ═════════════ CardIQ design system · warm monochrome, single accent ═════════════ */
:root{
  --bg:#F6F5F1; --bg2:#EFEEE9; --surface:#FFFFFF; --surface2:#FAFAF8;
  --line:#E7E5DF; --line2:#D9D6CE;
  --text:#1B1B19; --text2:#5F5E59; --muted:#8F8D86;
  --accent:#1F6B57; --accent-ink:#FFFFFF;
  --accentd:#E6F0EC; --accentd2:#C9DED6;
  --green:#2E7148; --greend:#EAF2EA; --greend2:#D3E6D4;
  --gold:#946200; --goldd:#FBF2DA; --goldd2:#F2E2B4;
  --red:#A23A33; --redd:#FBEAE8;
  --amber:#A8571C; --purple:#4E5B78; --purpled:#E9ECF2;
  /* legacy aliases used by inline styles */
  --ink:var(--bg); --ink2:var(--surface); --s0:var(--surface); --s1:var(--bg2); --bd:var(--line); --bd2:var(--line2);
  --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(40,35,20,.04),0 8px 24px -12px rgba(40,35,20,.10);
  --shadow-lg:0 24px 60px -24px rgba(40,35,20,.28);
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.36,.64,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --nav:64px; --top:56px;
  --sans:'Geist',-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;
  --mono:'Geist Mono','SF Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121211; --bg2:#1C1C1A; --surface:#191917; --surface2:#1F1F1D;
    --line:#2A2A27; --line2:#3A3935;
    --text:#ECEBE6; --text2:#B0AEA6; --muted:#7D7B74;
    --accent:#6DBFA4; --accent-ink:#0F1F1A;
    --accentd:#1B2C26; --accentd2:#284339;
    --green:#7CC48F; --greend:#1A2A1F; --greend2:#24402C;
    --gold:#E3B755; --goldd:#2B2416; --goldd2:#3D331C;
    --red:#E58A80; --redd:#2E1C1A;
    --amber:#E09A5F; --purple:#9EABC8; --purpled:#20242E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column;position:relative;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:'ss01','cv11'}
body::before{content:'';position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(40% 30% at 15% 10%,rgba(31,107,87,.07),transparent 70%),radial-gradient(35% 30% at 90% 85%,rgba(148,98,0,.05),transparent 70%);animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,3%,0)}}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;flex-shrink:0;display:inline-block;vertical-align:middle}
.ic-sm{width:16px;height:16px}
.mono{font-family:var(--mono);font-feature-settings:'tnum'}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── top bar ── */
.hdr{flex-shrink:0;position:relative;z-index:30;padding:var(--safe-t) 0 0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(20px);-webkit-backdrop-filter:saturate(1.4) blur(20px);border-bottom:1px solid transparent;transition:border-color .3s}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr-row{height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px;max-width:760px;margin:0 auto}
.wordmark{font-size:17px;font-weight:650;letter-spacing:-.4px;display:flex;align-items:center;gap:8px;background:none;border:none;padding:0}
.wordmark .mk{width:26px;height:26px;border-radius:7px;background:var(--text);color:var(--bg);display:grid;place-items:center;font:600 11px var(--mono);letter-spacing:-.5px}
.hdr-title{flex:1;min-width:0;position:relative;height:22px;overflow:hidden}
.hdr-title span{position:absolute;inset:0;font-size:15px;font-weight:550;color:var(--text2);white-space:nowrap;transition:transform .45s var(--ease),opacity .3s}
.hdr-title span.out{transform:translateY(-110%);opacity:0}
.hdr-title span.in{transform:translateY(110%);opacity:0}
.hdr-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.hdr-btn:active{transform:scale(.94)}
.hdr-sub{display:none}

/* ── screens & transitions ── */
.screens{flex:1;overflow:hidden;position:relative;z-index:1}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:8px 16px calc(var(--nav) + var(--safe-b) + 28px);display:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block}
.screen.enter-r{animation:inR .5s var(--ease) both}
.screen.enter-l{animation:inL .5s var(--ease) both}
.screen.enter-u{animation:inU .5s var(--ease) both}
.screen.leaving{display:block;pointer-events:none;animation:out .26s ease both}
@keyframes inR{from{opacity:0;transform:translate3d(28px,0,0)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translate3d(-28px,0,0)}to{opacity:1;transform:none}}
@keyframes inU{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:scale(.985)}}
.stagger>*{animation:rise .6s var(--ease) both;animation-delay:calc(min(var(--i,0),14) * 45ms)}
@keyframes rise{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.seen{opacity:1;transform:none}

/* ── bottom nav ── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:6px 10px calc(var(--safe-b) + 6px);background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:saturate(1.4) blur(22px);-webkit-backdrop-filter:saturate(1.4) blur(22px);border-top:1px solid var(--line)}
.nav-in{position:relative;display:grid;grid-template-columns:repeat(5,1fr);max-width:520px;margin:0 auto}
.nav-pill{position:absolute;top:2px;left:0;height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .5s var(--spring),width .5s var(--ease);pointer-events:none}
.ntab{position:relative;z-index:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--muted);transition:color .25s}
.ntab .ic{width:22px;height:22px;transition:transform .4s var(--spring)}
.ntab.on{color:var(--text)}
.ntab.on .ic{transform:translateY(-1px)}
.ntab:active .ic{transform:scale(.88)}
.ntab-lbl{font-size:10.5px;font-weight:550;letter-spacing:.1px}

/* ── typography primitives ── */
.stitle{font-size:28px;font-weight:620;letter-spacing:-.9px;line-height:1.1;margin:10px 0 18px}
.eyebrow,.alts-hd,.dynrec-hd,.rt-sec,.news-sources-hd,.opthd{font:550 11px var(--mono);letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;transition:box-shadow .25s,transform .25s var(--ease)}
.notice{border-radius:var(--r);padding:12px 14px;font-size:13px;line-height:1.55;margin-bottom:14px;border:1px solid var(--line);background:var(--surface);color:var(--text2)}
.n-gold{background:var(--goldd);border-color:var(--goldd2);color:var(--gold)}
.n-green{background:var(--greend);border-color:var(--greend2);color:var(--green)}

/* ── HOME ── */
.home-hero{display:grid;gap:6px;margin:18px 0 22px}
.home-date{font:550 11px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.home-date i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.home-h{font-size:34px;font-weight:620;letter-spacing:-1.3px;line-height:1.05}
.home-h em{font-style:normal;color:var(--muted)}
.home-p{font-size:15px;color:var(--text2);max-width:34ch;line-height:1.5}
.askbar{display:flex;align-items:center;gap:10px;width:100%;padding:14px 14px 14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:left;margin-bottom:26px;transition:transform .25s var(--ease)}
.askbar:active{transform:scale(.985)}
.askbar .tw{flex:1;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.askbar .tw b{font-weight:400;color:var(--text2)}
.askbar .caret{display:inline-block;width:1.5px;height:17px;background:var(--accent);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(2) infinite}
.askbar kbd{font:500 11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:2px 6px;background:var(--bg);color:var(--muted)}
@keyframes blink{50%{opacity:0}}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 12px}
.sec-hd h2{font-size:17px;font-weight:600;letter-spacing:-.3px}
.sec-hd button{border:none;background:none;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:2px;padding:4px 0}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.qk{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;transition:transform .25s var(--ease),border-color .2s}
.qk:active{transform:scale(.97)}
.qk .qi{width:34px;height:34px;border-radius:9px;background:var(--bg2);display:grid;place-items:center;color:var(--text)}
.qk .qn,.qk .qc{display:block}
.qk .qn{font-size:13.5px;font-weight:550;line-height:1.25}
.qk .qc{font-size:11.5px;color:var(--muted);margin-top:2px}
.qk .qr{font:600 15px var(--mono);color:var(--accent);margin-top:auto}
.qk.wide{grid-column:span 2;flex-direction:row;align-items:center}
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tile{grid-column:span 6;position:relative;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:18px;overflow:hidden;text-align:left;transition:transform .3s var(--ease),box-shadow .3s}
.tile:active{transform:scale(.985)}
.tile.t-4{grid-column:span 4}.tile.t-2{grid-column:span 2}.tile.t-3{grid-column:span 3}
.tile-lbl{font:550 10.5px var(--mono);letter-spacing:.9px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile-big{white-space:nowrap;font:600 32px var(--mono);letter-spacing:-1.5px;line-height:1;margin-top:10px}
.tile-big small{font-size:14px;letter-spacing:0;color:var(--muted);margin-left:2px}
.tile-sub{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.45}
.tile.dark{background:var(--text);color:var(--bg);border-color:var(--text)}
.tile.dark .tile-lbl,.tile.dark .tile-sub{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.ms-tile{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:color-mix(in srgb,var(--bg) 18%,transparent);stroke-width:8}
.ring .val{fill:none;stroke:var(--accentd2);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.4s var(--ease)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 18px var(--mono);letter-spacing:-.5px}
.count{font:600 40px var(--mono);letter-spacing:-2px;line-height:1;margin-top:10px}
.count+.tile-sub{margin-top:4px}
.bars{display:grid;gap:10px;margin-top:14px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.bar-row .bn{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .bv{font:600 12.5px var(--mono);color:var(--text)}
.bar-row .bt{grid-column:span 2;height:4px;border-radius:4px;background:var(--bg2);overflow:hidden}
.bar-row .bt i{display:block;height:100%;border-radius:4px;background:var(--text);transform-origin:left;transform:scaleX(0);transition:transform 1.2s var(--ease)}
.bar-row:first-child .bt i{background:var(--accent)}
.exits{margin-top:12px;display:grid}
.exit{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exit:first-child{border-top:none}
.exit i{width:8px;height:8px;border-radius:2px}
.exit .en{font-size:13px;font-weight:550}
.exit .ep{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exit b{font:600 13.5px var(--mono);color:var(--green)}
.wallet{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scroll-snap-type:x mandatory}
.wallet::-webkit-scrollbar{display:none}
.wcard{flex:0 0 172px;height:108px;border-radius:12px;position:relative;overflow:hidden;scroll-snap-align:start;border:none;text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:0 10px 24px -14px rgba(20,20,10,.6);transition:transform .35s var(--spring)}
.wcard:active{transform:scale(.96) rotate(-1deg)}
.wcard::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);transform:translateX(-100%);animation:sheen 6s ease-in-out infinite;animation-delay:calc(var(--i,0) * .7s)}
@keyframes sheen{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.wcard .wn{font-size:12px;font-weight:600;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.wcard .wl{font:500 10px var(--mono);opacity:.75}
.wcard .chipx{width:22px;height:16px;border-radius:3px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.2))}
.newsl{display:grid}
.newsi{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:none;border-right:none;border-bottom:none}
.newsi:first-child{border-top:none;padding-top:4px}
.newsi .nt{font-size:14px;font-weight:550;letter-spacing:-.1px;line-height:1.35}
.newsi .nm{font:500 11px var(--mono);color:var(--muted);letter-spacing:.3px}
.newsi .ic{color:var(--muted);grid-row:span 2;align-self:center}
.home-foot{font:500 11px var(--mono);color:var(--muted);text-align:center;margin:28px 0 8px;letter-spacing:.3px}

/* ── SPEND ── */
.srch{display:flex;align-items:center;gap:10px;padding:0 14px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:16px;color:var(--muted)}
.srch input{flex:1;border:none;background:none;outline:none;font-size:16px;color:var(--text)}
.srch input::placeholder{color:var(--muted)}
.cat-scroll{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.catbtn{display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;column-gap:10px;row-gap:2px;align-items:center;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;transition:transform .25s var(--ease),border-color .2s,background .2s;position:relative}
.catbtn:active{transform:scale(.97)}
.catbtn.sel{border-color:var(--text)}
.catbtn.hide{display:none}
.cat-e{grid-row:span 2;width:34px;height:34px;border-radius:9px;background:var(--bg2);display:grid;place-items:center;color:var(--text)}
.cat-n{font-size:13.5px;font-weight:550;line-height:1.2}
.cbadge{justify-self:start;font:600 12px var(--mono);color:var(--accent);background:none;padding:0}
.cbadge.cbw{color:var(--gold)}
.cat-empty{grid-column:span 2;padding:28px 12px;text-align:center;color:var(--muted);font-size:13.5px;display:none}
.rslide{animation:rise .5s var(--ease) both}
.rhero{border-radius:16px;background:var(--text);color:var(--bg);padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.rhero::after{content:'';position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 45%,transparent),transparent 70%);opacity:.6;animation:float 8s ease-in-out infinite}
@keyframes float{50%{transform:translate(-14px,12px)}}
.rhero-in{position:relative;z-index:1}
.rtag{font:550 10.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:color-mix(in srgb,var(--bg) 60%,transparent)}
.rname{font-size:26px;font-weight:620;letter-spacing:-.8px;margin-top:6px}
.rsub{font-size:13px;color:color-mix(in srgb,var(--bg) 70%,transparent);margin-top:2px}
.rretrow{display:flex;align-items:flex-end;gap:10px;margin:16px 0 4px}
.rnum{font:600 48px var(--mono);letter-spacing:-2.5px;line-height:.9}
.rnum.ng,.rnum.nb,.rnum.na{color:var(--bg)}
.rlbl{font:500 10.5px var(--mono);color:color-mix(in srgb,var(--bg) 55%,transparent);line-height:1.3;padding-bottom:4px}
.rreason{font-size:13.5px;line-height:1.55;color:color-mix(in srgb,var(--bg) 82%,transparent);margin-top:12px}
.rcaveat{display:flex;gap:8px;font-size:12.5px;line-height:1.5;margin-top:12px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--bg) 10%,transparent);color:color-mix(in srgb,var(--bg) 85%,transparent)}
.alts-hd{margin:18px 0 6px}
.altrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.altname{font-size:14px;font-weight:550}
.altnote{font-size:12px;color:var(--muted);margin-top:1px}
.altrate{font:600 14px var(--mono);color:var(--text)}
.amt-row{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:border-color .2s}
.amt-row:focus-within{border-color:var(--text)}
.amt-label{font:550 12px var(--mono);color:var(--muted)}
.amt-input{flex:1;border:none;background:none;outline:none;font:500 18px var(--mono);color:var(--text);min-width:0}
.amt-input::placeholder{color:var(--muted);font:400 15px var(--sans)}
.dynrec{margin-top:14px;animation:rise .45s var(--ease) both}
.dynrec-hd{margin-bottom:4px}
.rec-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.rec-rank{font:500 13px var(--mono);color:var(--muted);padding-top:1px}
.rec-row.winner .rec-rank{color:var(--accent)}
.rec-card{font-size:14px;font-weight:550;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rec-note{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45}
.rec-boost{font-size:11.5px;color:var(--gold);margin-top:4px}
.rec-rate{text-align:right}
.rec-pct{font:600 15px var(--mono);color:var(--text)}
.rec-pct.top{color:var(--accent)}
.rec-pts{font:500 11px var(--mono);color:var(--muted);margin-top:2px}
.ms-tag{font:600 9.5px var(--mono);letter-spacing:.6px;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--goldd);color:var(--gold)}

/* ── sheets (generic) ── */
.backdrop{position:fixed;inset:0;z-index:150;background:rgba(20,18,12,.32);opacity:0;pointer-events:none;transition:opacity .35s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:160;max-width:760px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);transform:translate3d(0,105%,0);transition:transform .5s var(--ease);display:flex;flex-direction:column;max-height:88dvh;padding-bottom:var(--safe-b)}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grab{padding:10px 0 4px;display:grid;place-items:center;flex-shrink:0;touch-action:none;cursor:grab}
.grab i{width:36px;height:4px;border-radius:4px;background:var(--line2)}
.sheet-hd{display:flex;align-items:center;gap:10px;padding:4px 18px 12px;flex-shrink:0}
.sheet-hd h3{flex:1;font-size:17px;font-weight:600;letter-spacing:-.3px}
.sheet-body{overflow-y:auto;padding:0 18px 22px;-webkit-overflow-scrolling:touch}
.x-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg2);display:grid;place-items:center;color:var(--text2)}
.more-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 18px 22px}
.more-i{display:flex;flex-direction:column;gap:22px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;transition:transform .25s var(--ease)}
.more-i:active{transform:scale(.97)}
.more-i b{font-size:15px;font-weight:600}
.more-i small{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}

/* ── chat ── */
.chat-backdrop{position:fixed;inset:0;z-index:150;background:rgba(20,18,12,.32);opacity:0;pointer-events:none;transition:opacity .35s}
.chat-backdrop.on{opacity:1;pointer-events:auto}
.chat-panel{position:fixed;left:0;right:0;bottom:0;z-index:170;max-width:760px;margin:0 auto;height:86dvh;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translate3d(0,105%,0);transition:transform .5s var(--ease);padding-bottom:var(--safe-b)}
.chat-panel.on{transform:none}
.chat-panel.drag{transition:none}
.chat-panel-hd{display:flex;align-items:center;gap:10px;padding:2px 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.chat-panel-title{flex:1;font-size:16px;font-weight:600;letter-spacing:-.3px;display:flex;flex-direction:column}
.chat-model{font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.3px;font-weight:500;display:flex;align-items:center;gap:6px;margin-top:1px}
.chat-model i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.chat-close,.key-icon-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg2);display:grid;place-items:center;color:var(--text2)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:12px 18px 4px;flex-shrink:0}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:12.5px;color:var(--text2);white-space:nowrap;transition:transform .2s var(--ease),border-color .2s}
.chip:active{transform:scale(.95);border-color:var(--text)}
.chat-msgs{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.chat-msgs::-webkit-scrollbar{display:none}
.mbot,.muser{display:flex;flex-direction:column;max-width:88%;animation:rise .4s var(--ease) both}
.mbot{align-self:flex-start}.muser{align-self:flex-end;align-items:flex-end}
.mbub{font-size:14px;line-height:1.55;padding:11px 14px;border-radius:16px}
.mbot .mbub{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.muser .mbub{background:var(--text);color:var(--bg);border-bottom-right-radius:5px}
.mtime{font:500 10px var(--mono);color:var(--muted);margin:4px 6px 0}
.typing{display:inline-flex;gap:4px;padding:3px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tdot 1.1s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chat-input-row{display:flex;align-items:flex-end;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--line);flex-shrink:0}
.chatinput{flex:1;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;font-size:16px;line-height:1.35;outline:none;max-height:96px;transition:border-color .2s}
.chatinput:focus{border-color:var(--text)}
.chatinput::placeholder{color:var(--muted)}
.sendbtn{width:44px;height:44px;border-radius:12px;border:none;background:var(--text);color:var(--bg);display:grid;place-items:center;flex-shrink:0;transition:transform .2s var(--spring)}
.sendbtn:active{transform:scale(.9)}
.sendbtn svg{width:18px;height:18px}
.chat-src{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.mbub .mdt{border-collapse:collapse;margin:8px 0;font-size:12.5px;width:100%}
.mbub .mdt th,.mbub .mdt td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.mbub .mdt th{font:550 10.5px var(--mono);text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.mbub .mdl{margin:6px 0 4px 18px}.mbub .mdl li{margin:3px 0}
.mbub .mdh{font-weight:600;margin:8px 0 2px}
.mbub code{font:12px var(--mono);background:var(--bg2);padding:1px 5px;border-radius:4px}
.mbub strong{font-weight:600}
.mbub a{color:var(--accent)}
.ans-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ans-act button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text);display:flex;align-items:center;gap:4px}

/* ── MILES ── */
.gmail-scan-btn{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);border:1px dashed var(--line2);background:transparent;text-align:left;margin-bottom:14px;transition:transform .2s var(--ease)}
.gmail-scan-btn:active{transform:scale(.985)}
.gmail-scan-icon{width:36px;height:36px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;font-size:0}
.gmail-scan-icon::before{content:'';width:18px;height:18px;background:var(--text2);-webkit-mask:var(--ic-mail) center/contain no-repeat;mask:var(--ic-mail) center/contain no-repeat}
.gmail-scan-text{flex:1}
.gmail-scan-title{font-size:14px;font-weight:550}
.gmail-scan-sub{font-size:12px;color:var(--muted)}
.ms-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.ms-card.urgent{border-color:var(--goldd2)}
.ms-card.urgent::before{content:'';position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.ms-card.done{background:var(--greend);border-color:var(--greend2)}
.ms-header{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}
.ms-card-name{font:550 10.5px var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.ms-name{font-size:17px;font-weight:600;letter-spacing:-.3px;margin-top:4px}
.ms-period{font-size:12px;color:var(--muted);margin-top:2px}
.ms-eff-rate{text-align:right}
.ms-eff-lbl{font:500 10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.ms-eff-num{font:600 26px var(--mono);letter-spacing:-1px;line-height:1.1;margin-top:2px}
.ms-eff-num.boosted{color:var(--accent)}.ms-eff-num.base{color:var(--text)}.ms-eff-num.done-c{color:var(--green)}
.ms-prog-wrap{margin-bottom:14px}
.ms-prog-labels{display:flex;justify-content:space-between;font:500 11.5px var(--mono);color:var(--muted);margin-bottom:8px}
.ms-prog-spent{color:var(--text)}
.ms-bar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden}
.ms-fill{height:100%;border-radius:6px;transition:width .9s var(--ease),background .3s}
.ms-input-row{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:14px}
.ms-input-row:focus-within{border-color:var(--text)}
.ms-input-lbl{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ms-input{flex:1;border:none;background:none;outline:none;font:500 16px var(--mono);text-align:right;min-width:0}
.ms-breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.ms-bk{background:var(--surface);padding:10px 12px}
.ms-card.done .ms-bk{background:var(--greend)}
.ms-bk-lbl{font-size:11px;color:var(--muted)}
.ms-bk-val{font:600 15px var(--mono);margin-top:2px}
.ms-bk-val.g{color:var(--green)}.ms-bk-val.b{color:var(--text)}.ms-bk-val.o{color:var(--gold)}.ms-bk-val.r{color:var(--red)}
.ms-deadline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.ms-dl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ms-done-badge{margin-left:auto;font:600 10px var(--mono);letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--greend2);color:var(--green)}
.txn-pips{display:flex;gap:8px;margin-bottom:14px}
.txn-pip{flex:1;height:44px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font:600 14px var(--mono);color:var(--muted);cursor:pointer;transition:all .3s var(--spring)}
.txn-pip:active{transform:scale(.92)}
.txn-pip.done{background:var(--text);border-color:var(--text);color:var(--bg)}

/* ── CARDS ── */
.ccard-row{display:flex;gap:14px;align-items:center;padding:14px;cursor:pointer}
.ccard-art{width:104px;height:66px;border-radius:9px;flex-shrink:0;position:relative;overflow:hidden;box-shadow:0 8px 18px -12px rgba(20,20,10,.6);transition:transform .4s var(--spring)}
.ccard-row:active .ccard-art{transform:rotate(-2deg) scale(.97)}
.ccard-art-inner{position:absolute;inset:0;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between}
.ccard-chip{width:16px;height:12px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.2));border-radius:2px}
.ccard-label{font-size:8.5px;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:.3px;line-height:1.3}
.ccard-iss{font-size:7.5px;color:rgba(255,255,255,.6)}
.ccard-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ccard-chip-row{display:flex;align-items:center;justify-content:space-between}
.ctext{flex:1;min-width:0}
.cname{font-size:15px;font-weight:600;letter-spacing:-.2px}
.ciss{font-size:12px;color:var(--muted);margin-top:1px}
.cchev{color:var(--muted);font-size:20px;transition:transform .35s var(--ease)}
.cchev.op{transform:rotate(90deg)}
.cdet{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease);padding:0 14px}
.cdet>*{overflow:hidden;min-height:0}
.cdet.op{grid-template-rows:1fr;padding-bottom:14px}
.cdet-in{min-height:0;overflow:hidden}
.primary-badge{font:550 10.5px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.tag{font:550 10px var(--mono);letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--bg2);color:var(--text2)}
.tb{background:var(--purpled);color:var(--purple)}.tg{background:var(--greend);color:var(--green)}.to{background:var(--goldd);color:var(--gold)}.tr{background:var(--redd);color:var(--red)}.tp{background:var(--purpled);color:var(--purple)}.tl{background:var(--text);color:var(--bg)}
.earns{border-top:1px solid var(--line);margin-bottom:12px}
.erow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.ecat{color:var(--text2)}
.erate{font:600 13px var(--mono)}
.eunit{font:500 11px var(--mono);color:var(--muted)}
.infobox{font-size:13px;line-height:1.6;color:var(--text2);background:var(--bg);border-radius:10px;padding:12px}
.ig{color:var(--green);font-weight:600}.iw{color:var(--red);font-weight:600}.io{color:var(--gold);font-weight:600}.ia{color:var(--accent);font-weight:600}

/* ── STRATEGY ── */
.opthero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 6px;margin-bottom:12px}
.opthd{margin-bottom:6px}
.rtrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.rtrow:last-child{border-bottom:none}
.rtspend{font-size:13.5px;font-weight:550;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rtcard{font-size:12px;color:var(--muted)}
.rtval{font:600 14px var(--mono);white-space:nowrap}
.rtval.top{color:var(--accent)}
.newtag{font:600 9px var(--mono);letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border-radius:99px;background:var(--accentd);color:var(--accent)}
.valrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.valrow:last-child{border-bottom:none}
.valname{color:var(--text2)}
.valnum{font:600 13px var(--mono)}
.capcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:8px}
.caphd{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}
.capname{font-size:14px;font-weight:550}
.capsub{font-size:12px;color:var(--muted);margin-top:2px}

.capbar{height:4px;border-radius:4px;background:var(--bg2);overflow:hidden}
.capfill{height:100%}
.chain{border-left:2px solid var(--line2);padding:2px 0 2px 14px;margin:0 0 16px 4px}
.chaintitle{font-size:14px;font-weight:600}
.chainsteps{font:500 12px var(--mono);color:var(--text2);margin-top:4px}
.chainyield{font-size:12.5px;color:var(--green);margin-top:4px}
.chainnote{font-size:12px;color:var(--muted);margin-top:2px}
.hzitem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hzitem:last-child{border-bottom:none}
.hzdot{width:7px;height:7px;border-radius:50%;margin-top:7px;flex-shrink:0}
.hztext{font-size:13px;line-height:1.5;color:var(--text2)}
.hztext strong{color:var(--text);font-weight:600}
.hzdate{font:500 11px var(--mono);color:var(--muted);margin-top:2px}

/* ── NEWS ── */
.filter-chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px}
.filter-chips::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--text2);cursor:pointer;transition:all .25s var(--ease)}

.news-title{font-size:16px;font-weight:600;letter-spacing:-.3px;line-height:1.3}
.news-summary{font-size:13.5px;color:var(--text2);line-height:1.55;margin-top:6px}
.news-warn{font-size:12.5px;color:var(--red);margin-top:8px}
.news-impact{font-size:12.5px;line-height:1.5;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);color:var(--text)}

.news-tags{display:flex;gap:4px;flex-wrap:wrap}
.ntag{font:550 9.5px var(--mono);letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--bg2);color:var(--text2)}
.news-exp{font:500 11px var(--mono);color:var(--gold)}
.news-read{font-size:12.5px;font-weight:550;color:var(--text)}
.news-sources-hd{margin:24px 0 8px}
.source-link{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}

.source-link-url{font:500 11.5px var(--mono);color:var(--muted)}

/* ── LOYALTY ── */
.loy-notice{font-size:12.5px;color:var(--text2);line-height:1.55;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.lcard{border-radius:16px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line);background:var(--surface)}

.status-big{font-size:20px;font-weight:620;letter-spacing:-.5px}

.acct-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--bg);margin-bottom:10px;cursor:pointer}
.acct-icon{width:28px;height:28px;border-radius:8px;background:var(--bg2);display:grid;place-items:center;font-size:0}
.acct-icon::before{content:'';width:15px;height:15px;background:var(--text2);-webkit-mask:var(--ic-key) center/contain no-repeat;mask:var(--ic-key) center/contain no-repeat}
.acct-lbl{font-size:11px;color:var(--muted)}
.acct-num{font:600 14px var(--mono);letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-edit{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:12.5px}
.acct-input-wrap{display:none;flex-direction:column;gap:8px;margin-bottom:12px}
.acct-input-wrap.open{display:flex}
.acct-field{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);font-size:16px;outline:none}
.acct-field:focus{border-color:var(--text)}
.acct-save{height:44px;border:none;border-radius:10px;background:var(--text);color:var(--bg);font-weight:550}
.tier-block{margin-bottom:14px}
.tier-hd{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}

<script>
// ══════════════════════════════════════════════════════════
// MILESTONE DEFINITIONS
// ══════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════
// DATA VERSION — refreshed from project memory + web check
// ══════════════════════════════════════════════════════════
const DATA_ASOF = '21 Nov 2026';
const _MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function _ymd(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function _qInfo(dt=new Date()){
  const y=dt.getFullYear(), q=Math.floor(dt.getMonth()/3), last=new Date(y,q*3+3,0).getDate();
  return { key:`${y}Q${q+1}`, label:`${_MON[q*3]} – ${_MON[q*3+2]} ${y}`, end:_ymd(y,q*3+2,last) };
}
function _mInfo(dt=new Date()){
  const y=dt.getFullYear(), m=dt.getMonth(), last=new Date(y,m+1,0).getDate();
  return { key:`${y}-${m+1}`, label:`${_MON[m]} ${y}`, end:_ymd(y,m,last) };
}
const QTR=_qInfo(), MON=_mInfo();

// ══════════════════════════════════════════════════════════
// MILESTONE DEFINITIONS
// ══════════════════════════════════════════════════════════
const MS_DEFS = [
  {
    id:'dcb_q', card:'DCB Metal', emoji:'⚫', grad:'linear-gradient(135deg,#111827,#374151)',
    name:'Quarterly Milestone', period:QTR.label, periodKey:QTR.key, deadline:QTR.end,
    type:'spend', threshold:400000,
    rewardLabel:'10,000 Reward Points', rewardValue:10000,
    rewardNote:'10k RP @ ₹1 face (≈₹16k if sent 1:1 to KrisFlyer)',
    baseRate:3.33, defaultSpend:0, color:'#8E3B5E', urgent:true,
  },
  {
    id:'dcb_yr', card:'DCB Metal', emoji:'⚫', grad:'linear-gradient(135deg,#111827,#374151)',
    name:'Annual Fee Waiver', period:'Card year (edit if renewal differs)', periodKey:'dcb-fy26-27', deadline:'2027-03-31',
    type:'spend', threshold:800000,
    rewardLabel:'Fee waiver', rewardValue:11800, rewardNote:'Waives ₹10,000 + GST',
    baseRate:3.33, defaultSpend:0, color:'#6D28D9',
  },
  {
    id:'amex_pt2', card:'Amex Plat Travel', emoji:'🌟', grad:'linear-gradient(135deg,#78350F,#B45309)',
    name:'₹4L Milestone', period:'Card year · ₹1.9L tier removed 10 Sep 2026', periodKey:'pt-y1', deadline:'2026-12-31',
    type:'spend', threshold:400000,
    rewardLabel:'10,000 MR', rewardValue:7000, rewardNote:'10k MR × ₹0.7',
    baseRate:1.4, defaultSpend:0, color:'#D97706', approx:true,
  },
  {
    id:'amex_pt3', card:'Amex Plat Travel', emoji:'🌟', grad:'linear-gradient(135deg,#78350F,#B45309)',
    name:'₹7L Milestone — Taj', period:'Card year · 22,500 MR swapped for Taj card', periodKey:'pt-y1', deadline:'2026-12-31',
    type:'spend', threshold:700000,
    rewardLabel:'₹20,000 Taj e-gift card', rewardValue:20000, rewardNote:'Counted at face value',
    baseRate:1.4, defaultSpend:0, color:'#EF4444', approx:true, prevId:'amex_pt2',
  },
  {
    id:'mrcc_mo', card:'Amex MRCC', emoji:'🎁', grad:'linear-gradient(135deg,#1E3A8A,#2563EB)',
    name:'4 txns ≥ ₹1,500', period:MON.label, periodKey:MON.key, deadline:MON.end,
    type:'transaction', threshold:4, txnMin:1500,
    rewardLabel:'1,000 Bonus MR', rewardValue:700, rewardNote:'1,000 MR × ₹0.7',
    baseRate:1.4, defaultSpend:0, color:'#2F5D9E',
  },
  {
    id:'mrcc_20k', card:'Amex MRCC', emoji:'🎁', grad:'linear-gradient(135deg,#1E3A8A,#2563EB)',
    name:'₹20K Monthly Spend', period:MON.label+' · stacks with 4-txn bonus', periodKey:MON.key, deadline:MON.end,
    type:'spend', threshold:20000,
    rewardLabel:'1,000 Bonus MR', rewardValue:700, rewardNote:'Use non-voucher spend — vouchers go to Plat Charge ShopWise',
    baseRate:1.4, defaultSpend:0, color:'#3B82F6',
  },
];

// Live milestone state — persisted per period, auto-resets when quarter/month rolls
const MS = {};
(function(){
  let saved={}; try{ saved=JSON.parse(localStorage.getItem('ciq_ms')||'{}'); }catch(e){}
  MS_DEFS.forEach(m=>{ const s=saved[m.id]; MS[m.id]=(s&&s.k===m.periodKey)?s.v:(m.defaultSpend||0); });
})();
function saveMS(){ try{ const o={}; MS_DEFS.forEach(m=>o[m.id]={k:m.periodKey,v:MS[m.id]}); localStorage.setItem('ciq_ms',JSON.stringify(o)); }catch(e){} }

// Milestone math
function msRemaining(def) {
  const cur = MS[def.id];
  return Math.max(0, def.threshold - cur);
}
function msBoost(def) {
  const rem = msRemaining(def);
  if (rem <= 0 || def.type === 'transaction') return 0;
  return (def.rewardValue / rem) * 100;
}
function msEffRate(def) {
  if (def.type === 'transaction') {
    const done = MS[def.id];
    if (done >= 4) return { rate: def.baseRate, boost: 0, done: true };
    const rem = 4 - done;
    const boostPerTxn = (def.rewardValue / (rem * def.txnMin)) * 100;
    return { rate: def.baseRate + boostPerTxn, boost: boostPerTxn, done: false };
  }
  const boost = msBoost(def);
  const done = msRemaining(def) <= 0;
  return { rate: done ? def.baseRate : def.baseRate + boost, boost, done };
}
function pct(n) { return n > 0 ? n.toFixed(1) + '%' : '—'; }
function lakhs(n) {
  if (n >= 100000) return '₹' + (n/100000).toFixed(2) + 'L';
  if (n >= 1000) return '₹' + (n/1000).toFixed(0) + 'k';
  return '₹' + n;
}
function daysLeft(deadline) {
  const d = Math.ceil((new Date(deadline) - new Date()) / 86400000);
  return d;
}

// ══════════════════════════════════════════════════════════

// Forex: Premier 1.167% · DCB 2.36% less 1% Valueback · Atlas/TravelOne/Amex 4.13%
// ══════════════════════════════════════════════════════════

function renderSpendResult(id, amt){
  const c = CATS.find(x=>x.id===id);
  const ahtml = c.alts.map(a=>`<div class="altrow"><div><div class="altname">${a.l}</div><div class="altnote">${a.n}</div></div><div class="altrate">${a.r}</div></div>`).join('');
  const rnum = c.rv>0?`<div class="rretrow"><div class="rnum ${c.rc}" id="rn-${id}">0.0%</div><div class="rlbl">gross/net<br>return</div></div>`:'';

  document.getElementById('catr').innerHTML=`<div class="rslide">
    <div class="rhero"><div class="rhero-in">
      <div class="rtag">Best card</div>
      <div class="rname">${c.best}</div>
      <div class="rsub">${c.bsub}</div>
      ${rnum}
      <div class="rreason">${c.why}</div>
      ${c.cav?`<div class="rcaveat">⚡<span>${c.cav}</span></div>`:''}
    </div></div>
    ${ahtml?`<div class="alts-hd">Alternatives</div>${ahtml}`:''}
    <div class="amt-row" style="margin-top:12px">
      <span class="amt-label">₹ Amount</span>
      <input class="amt-input" type="number" id="amtinp" placeholder="Enter spend amount…" value="${amt||''}" oninput="onAmt('${id}',this.value)">
    </div>
    <div id="dynrec"></div>
  </div>`;

  if(c.rv>0) animn(document.getElementById('rn-'+id), c.rv);
  if(amt) renderDyn(id, parseFloat(amt));
}

function onAmt(id, val){
  const amt = parseFloat(val);
  if(!val || isNaN(amt) || amt <= 0){
    document.getElementById('dynrec').innerHTML='';
    return;
  }
  renderDyn(id, amt);
}

  const cat = CATS.find(c=>c.id===catId);

    } else {
      rows=[

    const rupeeVal = r.rate>0 ? Math.round(r.rate/100*amt) : 0;
    const ptsEarned = r.ptsRate ? Math.round(r.ptsRate*amt/100) : null;
    const topVal = ptsEarned ? `${ptsEarned.toLocaleString('en-IN')} ${r.ptsProg}` : pctStr;

      <div class="rec-rank">${i===1?'②':i===2?'③':i===3?'④':'①'}</div>

        ${subVal?`<div class="rec-pts">${subVal}</div>`:''}
      </div>
    </div>`;
  });
  rhtml += '</div>';
  document.getElementById('dynrec').innerHTML = rhtml;
}

function animn(el,target){
  const dur=680,t0=performance.now();
  const run=t=>{const p=Math.min((t-t0)/dur,1),e=1-(1-p)**3;el.textContent=(target*e).toFixed(1)+'%';if(p<1)requestAnimationFrame(run)};
  requestAnimationFrame(run);
}

function updateMs(id, val){
  const n = Math.max(0, parseFloat(val)||0);
  MS[id] = n;
  const def = MS_DEFS.find(m=>m.id===id);
  // re-render breakdown
  const bd = document.getElementById('msbd-'+id);
  if(bd) bd.innerHTML = msBdHtml(def);
  // update progress bar
  const mc = document.getElementById('mc-'+id);
  if(mc){
    const fill = mc.querySelector('.ms-fill');
    if(fill){
      const pct = Math.min(100,(n/def.threshold)*100).toFixed(1);
      const col = pct>75?'var(--green)':pct>40?'var(--gold)':'var(--accent)';
      fill.style.width=pct+'%'; fill.style.background=col;
    }
    const progSpent = mc.querySelector('.ms-prog-spent');
    if(progSpent) progSpent.textContent = lakhs(n) + ' spent';
  }
  // update header rate
  const eff = msEffRate(def);
  const effEl = mc && mc.querySelector('.ms-eff-num');
  if(effEl){ effEl.textContent = eff.done?'✅':eff.rate.toFixed(1)+'%'; effEl.className='ms-eff-num '+(eff.done?'done-c':eff.rate>10?'boosted':'base'); }
  // re-render dynrec if on spend tab
  if(selCatId){
    const inp = document.getElementById('amtinp');
    if(inp && inp.value) renderDyn(selCatId, parseFloat(inp.value));
  }
  // update notice bar
  const notice = document.querySelector('#screen-miles .notice');
  if(notice){ notice.textContent=dcbNotice(); }
  saveMS();
}

function txnPip(id, count){
  MS[id] = count > MS[id] ? count : count - 1; // toggle
  if(MS[id]<0) MS[id]=0;
  const def = MS_DEFS.find(m=>m.id===id);
  const mc = document.getElementById('mc-'+id);
  // re-render pips
  const pipsEl = document.getElementById('pips-'+id);
  if(pipsEl) pipsEl.innerHTML = Array.from({length:4},(_,i)=>`<div class="txn-pip ${i<MS[id]?'done':''}" onclick="txnPip('${id}',${i+1})">${i<MS[id]?'✓':(i+1)}</div>`).join('');
  // re-render breakdown
  const bd = document.getElementById('msbd-'+id);
  if(bd) bd.innerHTML = msBdHtml(def);
  // update header rate
  const eff = msEffRate(def);
  const effEl = mc && mc.querySelector('.ms-eff-num');
  if(effEl){ effEl.textContent=eff.done?'Done':eff.rate.toFixed(0)+'%'; }
  saveMS();
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function mdRender(src){
  const blocks=[]; let t=esc(src).replace(/```[\w-]*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push(`<pre class="mdpre">${c}</pre>`);return `\u0000${blocks.length-1}\u0000`;});
  const lines=t.split('\n'), out=[]; let i=0;
  const inline=s=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      let h=`<table class="mdt"><tr>${row(l).map(c=>`<th>${c}</th>`).join('')}</tr>`; i+=2;
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ h+=`<tr>${row(lines[i]).map(c=>`<td>${c}</td>`).join('')}</tr>`; i++; }
      out.push(h+'</table>'); continue;
    }
    if(/^\s*[-*•]\s+/.test(l)){ let h='<ul class="mdl">'; while(i<lines.length && /^\s*[-*•]\s+/.test(lines[i])){ h+=`<li>${inline(lines[i].replace(/^\s*[-*•]\s+/,''))}</li>`; i++; } out.push(h+'</ul>'); continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ let h='<ol class="mdl">'; while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ h+=`<li>${inline(lines[i].replace(/^\s*\d+[.)]\s+/,''))}</li>`; i++; } out.push(h+'</ol>'); continue; }
    const hm=l.match(/^#{1,4}\s+(.*)/); if(hm){ out.push(`<div class="mdh">${inline(hm[1])}</div>`); i++; continue; }
    out.push(l.trim()?inline(l):'<br>'); i++;
  }
  return out.join('\n').replace(/\n(?!<)/g,'<br>').replace(/\u0000(\d+)\u0000/g,(_,n)=>blocks[+n]);
}

function saveLoy(id){

function updateLoyProg(id,idx,val){
  const p=PROGRAMS.find(x=>x.id===id);
  const saved=lsGet(p.lsKey,{progOverrides:{}});
  if(!saved.progOverrides) saved.progOverrides={};
  saved.progOverrides[idx]=parseFloat(val)||0;
  lsSet(p.lsKey,saved);
  // update bar
  const pr=p.prog[idx];
  const pct=Math.min(100,(saved.progOverrides[idx]/pr.target)*100);
  const bars=document.querySelectorAll(`#lc-${id} .tier-fill`);
  if(bars[idx]) bars[idx].style.width=pct+'%';
  const pcts=document.querySelectorAll(`#lc-${id} .tier-pct`);

}

let _gmailTxns=[];
let _gsiLoaded=false;
let _tokenClient=null;

function scanGmail(){
  const clientId=localStorage.getItem('ciq_google_client_id');
  if(!clientId){
    showApiModal('ciq_google_client_id','Google Client ID',
      'Create an OAuth 2.0 Client ID at console.cloud.google.com → APIs & Services → Credentials. Enable Gmail API. Add your domain/localhost as authorised origin.',
      'your-client-id.apps.googleusercontent.com',
      ()=>scanGmail());
    return;
  }
  if(!_gsiLoaded||!window.google?.accounts?.oauth2){
    const sub=document.getElementById('gmail-scan-sub');
    if(sub) sub.textContent='Loading Google auth…';
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client';
    s.onload=()=>{ _gsiLoaded=true; _initTokenClient(clientId); };
    s.onerror=()=>{ if(sub) sub.textContent='Failed to load Google auth'; };
    document.head.appendChild(s);
    return;
  }
  _initTokenClient(clientId);
}

function _initTokenClient(clientId){
  _tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:clientId,
    scope:'https://www.googleapis.com/auth/gmail.readonly',
    callback:_handleGToken
  });
  _tokenClient.requestAccessToken({prompt:''});
}

async function _handleGToken(resp){
  const sub=document.getElementById('gmail-scan-sub');
  if(resp.error){ if(sub) sub.textContent='Sign-in failed: '+resp.error; return; }
  if(sub) sub.textContent='Scanning…';
  try{
    await _fetchGmail(resp.access_token);
  }catch(e){
    if(sub) sub.textContent='Scan error: '+e.message;
  }
}

async function _fetchGmail(token){
  const q=encodeURIComponent('(from:(alerts@hdfcbank.net OR infoindia@americanexpress.com OR alerts@axisbank.com OR notify@alerts.hsbc.co.in OR alerts@hsbc.co.in OR txnalert@axisbank.com) OR subject:(spent on your OR debit alert OR credit card transaction)) newer_than:90d');
  const listR=await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${q}&maxResults=75`,{headers:{Authorization:`Bearer ${token}`}});
  if(!listR.ok) throw new Error('Gmail API '+listR.status+' — check Client ID & scopes');
  const list=await listR.json();
  const msgs=list.messages||[];
  const sub=document.getElementById('gmail-scan-sub');
  if(!msgs.length){ if(sub) sub.textContent='No transaction emails found'; return; }
  if(sub) sub.textContent=`Fetching ${msgs.length} emails…`;
  const details=await Promise.all(msgs.slice(0,60).map(m=>
    fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${m.id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`,
      {headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json())
  ));
  _gmailTxns=_parseTxns(details);
  if(sub) sub.textContent=`Found ${_gmailTxns.length} transactions`;
  _showGmailSheet(_gmailTxns);
}

function _parseTxns(emails){
  const out=[];
  for(const e of emails){
    if(!e.payload) continue;
    const hdr=Object.fromEntries((e.payload.headers||[]).map(h=>[h.name,h.value]));
    const subj=hdr.Subject||'', from=hdr.From||'', dateStr=hdr.Date||'';
    const txn=_parseLine(subj,from,new Date(dateStr));
    if(txn) out.push(txn);
  }
  return out.sort((a,b)=>b.date-a.date);
}

function _parseLine(subj,from,date){
  // Match Indian bank alert patterns
  const amtM=subj.match(/(?:INR|Rs\.?|₹)\s*([\d,]+(?:\.\d{1,2})?)/i);
  if(!amtM) return null;
  const amount=parseFloat(amtM[1].replace(/,/g,''));
  if(!amount||amount<1||amount>10000000) return null;

  const src=(from+' '+subj).toLowerCase();
  let card='',cardId='',cardShort='';
  if(/hdfc|diners|dcb/.test(src)){card='DCB Metal';cardId='dcb_q';cardShort='DCB';}
  else if(/mrcc|membership reward/.test(src)){card='Amex MRCC';cardId='mrcc_20k';cardShort='MRCC';}
  else if(/amex|american express|platinum travel/.test(src)){card='Amex Plat Travel';cardId='amex_pt2';cardShort='Amex PT';}
  else if(/amex|american express/.test(src)){card='Amex';cardId='';cardShort='Amex';}
  else if(/hsbc/.test(src)){card='HSBC';cardId='';cardShort='HSBC';}
  else if(/axis/.test(src)){card='Axis';cardId='';cardShort='Axis';}
  else{card='Card';cardId='';cardShort='';}

  const mM=subj.match(/(?:at|merchant[:\s]+|towards)\s+([A-Za-z][A-Za-z0-9\s&'.,-]{2,28}?)(?:\s+on\s+|\s+dated|\s+for\s+|\s*$)/i);
  const merchant=mM?mM[1].trim():'Unknown';
  const cat=_inferCat(merchant);

  return {amount,merchant,card,cardId,cardShort,cat,date,sel:true};
}

function _inferCat(m){
  const s=m.toLowerCase();
  if(/marriott|accor|hilton|hyatt|ihg|sheraton|westin|taj|oberoi|itc hotel/.test(s)) return 'Hotel Direct';
  if(/indigo|air india|spicejet|vistara|airasia|go first/.test(s)) return 'Direct Airline MCC';
  if(/klook/.test(s)) return 'Klook / Tours';
  if(/getyourguide/.test(s)) return 'GetYourGuide';
  if(/amazon|flipkart|myntra|ajio|nykaa|meesho|tata cliq/.test(s)) return 'INR Shopping';
  if(/swiggy|zomato|dominos|mcdonalds|starbucks|café|restaurant|pizza|biryani/.test(s)) return 'Dining';
  return 'INR Shopping';
}

function _showGmailSheet(txns){
  const list=document.getElementById('gmail-txn-list');
  if(!txns.length){list.innerHTML='<div style="text-align:center;color:var(--muted);padding:20px">No transactions parsed</div>';return;}
  list.innerHTML=txns.map((t,i)=>`
    <div class="txn-item${t.sel?' sel':''}" onclick="_toggleTxn(${i})">
      <div class="txn-check${t.sel?' on':''}">${t.sel?'✓':''}</div>
      <div class="txn-info">
        <div class="txn-merchant">${t.merchant}</div>
        <div class="txn-detail">${t.cardShort||t.card} · ${t.cat} · ${t.date.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div>
      </div>
      <div class="txn-amt">₹${t.amount.toLocaleString('en-IN')}</div>
    </div>`).join('');
  document.getElementById('gmail-sheet-bg').classList.add('on');
}

function _toggleTxn(i){
  _gmailTxns[i].sel=!_gmailTxns[i].sel;
  _showGmailSheet(_gmailTxns);
}

function closeGmailSheet(){
  document.getElementById('gmail-sheet-bg').classList.remove('on');
}

function applyGmailTransactions(){
  const sel=_gmailTxns.filter(t=>t.sel&&t.cardId);
  const totals={};
  sel.forEach(t=>{
    if(!totals[t.cardId]) totals[t.cardId]=0;
    totals[t.cardId]+=t.amount;
  });
  Object.entries(totals).forEach(([id,amt])=>{
    const cur=MS[id]||0;
    MS[id]=cur+amt;
    const inp=document.getElementById('msi-'+id);
    if(inp){inp.value=MS[id];updateMs(id,MS[id]);}
    if(id==='amex_pt2'){ MS.amex_pt3=(MS.amex_pt3||0)+amt; const i3=document.getElementById('msi-amex_pt3'); if(i3){i3.value=MS.amex_pt3;updateMs('amex_pt3',MS.amex_pt3);} }
  });
  saveMS();
  closeGmailSheet();
  const totalAmt=Object.values(totals).reduce((a,b)=>a+b,0);
  const sub=document.getElementById('gmail-scan-sub');
  if(sub) sub.textContent=`Applied ${sel.length} txn${sel.length!==1?'s':''} · ₹${totalAmt.toLocaleString('en-IN')} added`;
}

function txPaths(from, opts={}){
  const hops = opts.hops!==false, out=[];
  const adj={}; TX_EDGES.forEach(e=>{ if(e.hop&&!hops) return; (adj[e.f]=adj[e.f]||[]).push(e); });
  const V=getVals();
  (function dfs(node, path, seen, ratio){
    (adj[node]||[]).forEach(e=>{
      if(seen.has(e.t)) return;
      const r=ratio*e.r, p=[...path,e];
      out.push({ from, to:e.t, edges:p, ratio:r, value:r*(V[e.t]||0) });
      if(p.length<3) dfs(e.t, p, new Set([...seen,e.t]), r);
    });
  })(from, [], new Set([from]), 1);
  return out;
}
function txPrune(paths){
  const sorted=[...paths].sort((a,b)=>b.value-a.value||a.edges.length-b.edges.length), kept=[];
  sorted.forEach(p=>{ if(!kept.some(q=>q.from===p.from&&q.to===p.to&&q.value>=p.value-1e-9&&q.edges.length<=p.edges.length)) kept.push(p); });
  return kept;
}
function txBestByDest(from, opts){
  const best={}; txPaths(from,opts).forEach(p=>{ if(!best[p.to]||p.value>best[p.to].value) best[p.to]=p; });
  return Object.values(best).sort((a,b)=>b.value-a.value);
}

const RT={ built:false, sel:null, filter:'all', hops:true, tf:{x:0,y:0,k:1}, pos:{} };

function rtLayout(){
  // deterministic force layout; currencies pinned to corners
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const N=[], idx={};
  TX_CUR.forEach(c=>{ idx[c.id]=N.length; N.push({id:c.id,x:c.pos[0],y:c.pos[1],vx:0,vy:0,pin:true}); });
  TX_PROG.forEach((p,i)=>{ const a=i/TX_PROG.length*Math.PI*2; idx[p.id]=N.length;
    N.push({id:p.id,x:500+Math.cos(a)*260+rnd()*40,y:500+Math.sin(a)*260+rnd()*40,vx:0,vy:0}); });
  const seenL=new Set(), L=[];
  TX_EDGES.forEach(e=>{ const k=[e.f,e.t].sort().join('|'); if(seenL.has(k)) return; seenL.add(k); L.push({a:idx[e.f],b:idx[e.t],len:e.hop?120:300,k:e.hop?0.03:0.012}); });
  for(let it=0;it<420;it++){
    const alpha=1-it/420;
    for(let i=0;i<N.length;i++) for(let j=i+1;j<N.length;j++){
      const A=N[i],B=N[j]; let dx=B.x-A.x, dy=B.y-A.y, d2=dx*dx+dy*dy||1, d=Math.sqrt(d2);
      let f=Math.min(9000/d2,6); if(d<58) f+= (58-d)*0.25;
      dx/=d; dy/=d; A.vx-=dx*f; A.vy-=dy*f; B.vx+=dx*f; B.vy+=dy*f;
    }
    L.forEach(l=>{ const A=N[l.a],B=N[l.b]; const dx=B.x-A.x, dy=B.y-A.y, d=Math.sqrt(dx*dx+dy*dy)||1; const f=(d-l.len)*l.k;
      A.vx+=dx/d*f; A.vy+=dy/d*f; B.vx-=dx/d*f; B.vy-=dy/d*f; });
    N.forEach(n=>{ if(n.pin){n.vx=n.vy=0;return;}
      n.vx+=(500-n.x)*0.004; n.vy+=(500-n.y)*0.004;
      n.x+=n.vx*alpha*0.9; n.y+=n.vy*alpha*0.9; n.vx*=0.6; n.vy*=0.6;
      n.x=Math.max(50,Math.min(950,n.x)); n.y=Math.max(50,Math.min(950,n.y)); });
  }
  N.forEach(n=>RT.pos[n.id]=[n.x,n.y]);
}

function rtVisible(id){
  if(TX_CUR.some(c=>c.id===id)) return true;
  const p=TX_PROG.find(x=>x.id===id); if(!p) return false;
  return RT.filter==='all' || (RT.filter==='air'&&p.t==='air') || (RT.filter==='hotel'&&p.t==='hotel');
}

function buildRoutes(){
  const el=document.getElementById('screen-routes');
  if(RT.built){ return; }
  RT.built=true;
  rtLayout();
  const opts=TX_PROG.map(p=>`<option value="${p.name}">`).join('');
  el.innerHTML=`<div class="stitle">Where your points can go</div>
  <div class="rt-bar">
    <button class="rt-f on" data-f="all" onclick="rtFilter('all',this)">All</button>
    <button class="rt-f" data-f="air" onclick="rtFilter('air',this)">Airlines</button>
    <button class="rt-f" data-f="hotel" onclick="rtFilter('hotel',this)">Hotels</button>
    <button class="rt-f on" id="rt-hopbtn" onclick="rtToggleHops(this)">Hops</button>
  </div>
  <div class="rt-search-row"><input class="rt-search" id="rt-q" list="rt-dl" placeholder="Find a program… e.g. Qatar" onchange="rtFind(this.value)"><datalist id="rt-dl">${opts}</datalist><button class="rt-reset" onclick="rtReset()">⟲</button></div>
  <div id="rt-wrap"><svg id="rt-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"><g id="rt-vp"><g id="rt-edges"></g><g id="rt-lbls"></g><g id="rt-nodes"></g></g></svg>
    <div class="rt-legend"><span><i style="background:#8E3B5E"></i>Axis</span><span><i style="background:#2F5D9E"></i>HDFC</span><span><i style="background:#C2463C"></i>HSBC</span><span><i style="background:#2E7D6B"></i>Amex</span><span><i class="dash"></i>hop</span></div>
    <div class="rt-hint">Pinch / drag · tap a node</div>
  </div>
  <div id="rt-panel"></div>`;
  rtDraw(); rtPanel(); rtBindGestures();
}

function rtDraw(){
  const P=RT.pos, eg=document.getElementById('rt-edges'), ng=document.getElementById('rt-nodes');
  const curColor=Object.fromEntries(TX_CUR.map(c=>[c.id,c.color]));
  let eh=''; RT.geo={};
  TX_EDGES.forEach((e,i)=>{
    if(e.hop&&!RT.hops) return;
    if(!rtVisible(e.f)||!rtVisible(e.t)) return;
    const [x1,y1]=P[e.f],[x2,y2]=P[e.t];
    const mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1, off=e.hop?0.12:0.06;
    const cx=mx-dy*off, cy=my+dx*off;
    const col=e.hop?'#C8961E':curColor[e.f]; RT.geo[i]=[x1,y1,cx,cy,x2,y2];
    eh+=`<path class="rt-e${e.hop?' hop':''}${e.st==='cut'?' cut':''}" data-e="${i}" d="M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}" style="stroke:${col}"/>`;
  });
  eg.innerHTML=eh;
  const indeg={}; TX_EDGES.forEach(e=>{ if(!e.hop) indeg[e.t]=(indeg[e.t]||0)+1; });
  let nh='';
  TX_CUR.forEach(c=>{ const [x,y]=P[c.id];
    nh+=`<g class="rt-n cur" data-id="${c.id}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><circle r="40" fill="${c.color}" fill-opacity=".18" stroke="${c.color}" stroke-width="3"/><text class="rt-ct" y="5">${c.short}</text><text class="rt-cl" y="62">${c.cards}</text></g>`; });
  TX_PROG.forEach(p=>{ if(!rtVisible(p.id)) return; const [x,y]=P[p.id]; const r=10+3*Math.sqrt(indeg[p.id]||0);
    const shape=p.t==='hotel'?`<rect x="${-r}" y="${-r}" width="${2*r}" height="${2*r}" rx="6"/>`:`<circle r="${r}"/>`;
    nh+=`<g class="rt-n ${p.t}${p.anchor?' anchor':''}" data-id="${p.id}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})">${shape}<text class="rt-pl" y="${r+17}">${p.short}</text></g>`; });
  ng.innerHTML=nh;
  rtApplySel(); rtApplyTf();
}

function rtApplyTf(){ const t=RT.tf; document.getElementById('rt-vp').setAttribute('transform',`translate(${t.x},${t.y}) scale(${t.k})`); }

function rtApplySel(){
  const svg=document.getElementById('rt-svg'); if(!svg) return;
  const lg=document.getElementById('rt-lbls'); lg.innerHTML='';
  svg.classList.toggle('has-sel',!!RT.sel);
  const hint=document.querySelector('.rt-hint'); if(hint) hint.textContent=RT.sel?`${TX_NAME(RT.sel)} · routes listed below ↓`:'Pinch / drag · tap a node';
  svg.querySelectorAll('.rt-e.hl,.rt-n.hl,.rt-n.focus').forEach(x=>x.classList.remove('hl','focus'));
  if(!RT.sel) return;
  const id=RT.sel, isCur=TX_CUR.some(c=>c.id===id), edges=new Set(), nodes=new Set([id]);
  if(isCur){
    TX_EDGES.forEach((e,i)=>{ if(e.f===id&&rtVisible(e.t)){ edges.add(i); nodes.add(e.t); } });
  } else {
    txPrune(TX_CUR.flatMap(c=>txPaths(c.id,{hops:RT.hops}).filter(p=>p.to===id))).forEach(p=>p.edges.forEach(e=>{ edges.add(TX_EDGES.indexOf(e)); nodes.add(e.f); nodes.add(e.t); }));
  }
  let lh='';
  edges.forEach(i=>{ const pe=svg.querySelector(`.rt-e[data-e="${i}"]`); if(!pe) return; pe.classList.add('hl');
    const e=TX_EDGES[i], G=RT.geo[i], t=0.55, u=1-t, pt={x:u*u*G[0]+2*u*t*G[2]+t*t*G[4], y:u*u*G[1]+2*u*t*G[3]+t*t*G[5]}, txt=ratioLbl(e)+(e.g?` ·${e.g}`:'');
    const w=txt.length*9+14;
    lh+=`<g class="rt-lb" transform="translate(${pt.x.toFixed(1)},${pt.y.toFixed(1)})"><rect x="${-w/2}" y="-12" width="${w}" height="22" rx="11" stroke="${e.hop?'#C8961E':(TX_CUR.find(c=>c.id===e.f)||{}).color||'#888'}"/><text y="4">${txt}</text></g>`; });
  lg.innerHTML=lh;
  nodes.forEach(n=>{ const g=svg.querySelector(`.rt-n[data-id="${n}"]`); if(g) g.classList.add('hl'); });
  const f=svg.querySelector(`.rt-n[data-id="${id}"]`); if(f) f.classList.add('focus');
}

function rtSelect(id){ RT.sel=(RT.sel===id?null:id); rtApplySel(); rtPanel(); const h=document.querySelector('.rt-hint'); if(h) h.textContent=RT.sel?`${TX_NAME(RT.sel)} · routes listed below ↓`:'Pinch / drag · tap a node'; }
function rtFilter(f,btn){ RT.filter=f; document.querySelectorAll('.rt-f[data-f]').forEach(b=>b.classList.toggle('on',b===btn)); if(RT.sel&&!rtVisible(RT.sel)) RT.sel=null; rtDraw(); rtPanel(); }
function rtToggleHops(btn){ RT.hops=!RT.hops; btn.classList.toggle('on',RT.hops); rtDraw(); rtPanel(); }
function rtFind(q){ const p=TX_PROG.find(x=>x.name.toLowerCase()===q.toLowerCase())||TX_PROG.find(x=>x.name.toLowerCase().includes(q.toLowerCase())||x.short.toLowerCase().includes(q.toLowerCase()));
  if(!p) return; if(!rtVisible(p.id)){ RT.filter='all'; document.querySelectorAll('.rt-f[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f==='all')); rtDraw(); }
  RT.sel=null; rtSelect(p.id); const [x,y]=RT.pos[p.id]; RT.tf={k:1.6,x:500-x*1.6,y:500-y*1.6}; rtApplyTf(); document.getElementById('rt-q').value=''; }
function rtReset(){ RT.tf={x:0,y:0,k:1}; RT.sel=null; rtApplyTf(); rtApplySel(); rtPanel(); const h=document.querySelector('.rt-hint'); if(h) h.textContent='Pinch / drag · tap a node'; }

function rtPathHtml(p){
  let h=`<span class="rt-pc" style="border-color:${(TX_CUR.find(c=>c.id===p.from)||{}).color}">${TX_NAME(p.from)}</span>`;
  p.edges.forEach(e=>{ h+=`<span class="rt-arrow">${ratioLbl(e)}${e.g?`<em>${e.g}</em>`:''}→</span><span class="rt-pc${e.hop?' hop':''}">${TX_NAME(e.t)}</span>`; });
  return h;
}
function rtNotes(p){
  const n=[]; p.edges.forEach(e=>{ if(e.g==='A') n.push('Group A cap'); if(e.g==='B'&&e.t!=='LH') n.push('Group B cap'); if(e.tat) n.push(e.tat); if(e.note) n.push(e.note); if(e.st==='cut') n.push('reduced ratio'); });
  return [...new Set(n)].join(' · ');
}
function rtPanel(){
  const el=document.getElementById('rt-panel'); if(!el) return;
  const V=getVals(), id=RT.sel, fmt=n=>n>=100?Math.round(n).toLocaleString('en-IN'):(+n.toFixed(2)).toString();
  if(!id){
    let h=`<div class="rt-sec">Best exit per currency <span>₹ value per bank point · ≤3 transfers${RT.hops?'':' · hops off'}</span></div>`;
    TX_CUR.forEach(c=>{
      const best=txBestByDest(c.id,{hops:RT.hops}).filter(p=>rtVisible(p.to)).slice(0,4);
      h+=`<div class="rt-card"><div class="rt-ch" onclick="rtSelect('${c.id}')"><span class="rt-dot" style="background:${c.color}"></span><b>${c.name}</b><small>${c.cards}</small><span class="rt-go">›</span></div>`;
      best.forEach(p=>{ h+=`<div class="rt-row" onclick="rtSelect('${p.to}')"><div class="rt-path">${rtPathHtml(p)}</div><div class="rt-val"><b>₹${p.value.toFixed(2)}</b><small>1k → ${fmt(p.ratio*1000)}</small></div></div>`; });
      h+=`</div>`;
    });
    h+=`<div class="rt-foot">Values use your anchors (KrisFlyer ₹1.6, Accor ₹2.1, Bonvoy ₹0.8) and editable estimates for the rest — tap any program to change its ₹/pt. Ratios checked ${DATA_ASOF}; confirm on the bank portal before moving points.</div>`;
    el.innerHTML=h; return;
  }
  const cur=TX_CUR.find(c=>c.id===id);
  if(cur){
    const best=txBestByDest(id,{hops:RT.hops}).filter(p=>rtVisible(p.to));
    let h=`<div class="rt-card sel"><div class="rt-ch"><span class="rt-dot" style="background:${cur.color}"></span><b>${cur.name}</b><small>${cur.cards}</small><span class="rt-go" onclick="rtSelect('${id}')">✕</span></div><div class="rt-note">${cur.note}</div>
      <div class="rt-sec in">All reachable programs, best route each</div>`;
    best.forEach((p,i)=>{ h+=`<div class="rt-row" onclick="rtSelect('${p.to}')"><div class="rt-rank">${i+1}</div><div class="rt-path">${rtPathHtml(p)}<div class="rt-sub">${rtNotes(p)}</div></div><div class="rt-val"><b>₹${p.value.toFixed(2)}</b><small>1k → ${fmt(p.ratio*1000)}</small></div></div>`; });
    el.innerHTML=h+'</div>'; return;
  }
  const prog=TX_PROG.find(p=>p.id===id);
  let routes=[]; TX_CUR.forEach(c=>txPaths(c.id,{hops:RT.hops}).filter(p=>p.to===id).forEach(p=>routes.push(p)));
  routes=txPrune(routes);
  let h=`<div class="rt-card sel"><div class="rt-ch"><span class="rt-dot" style="background:${prog.t==='hotel'?'var(--purple)':'var(--accent)'}"></span><b>${prog.name}</b><small>${prog.t==='hotel'?'Hotel':'Airline'}${prog.al?' · '+prog.al:''}</small><span class="rt-go" onclick="rtSelect('${id}')">✕</span></div>
    <div class="rt-valedit">Value ₹ <input type="number" step="0.05" value="${V[id]}" onchange="setVal('${id}',this.value)"> per point ${prog.anchor?'<span class="tag tg">your anchor</span>':'<span class="tag to">estimate</span>'}</div>
    ${TX_NODE_NOTE[id]?`<div class="rt-note">${TX_NODE_NOTE[id]}</div>`:''}
    <div class="rt-sec in">${routes.length} route${routes.length!==1?'s':''} · ranked by ₹ per bank point</div>`;
  if(!routes.length) h+=`<div class="rt-note">No route from your cards${RT.hops?'':' (try turning hops on)'}.</div>`;
  routes.forEach((p,i)=>{ h+=`<div class="rt-row"><div class="rt-rank">${i+1}</div><div class="rt-path">${rtPathHtml(p)}<div class="rt-sub">${p.edges.length>1?p.edges.length+' transfers · ':''}${rtNotes(p)}</div></div><div class="rt-val"><b>₹${p.value.toFixed(2)}</b><small>1k → ${fmt(p.ratio*1000)}</small></div></div>`; });
  el.innerHTML=h+'</div>';
}

function rtBindGestures(){
  const svg=document.getElementById('rt-svg'), pts=new Map(); let start=null, pinch=null;
  const scale=()=>{ const r=svg.getBoundingClientRect(); return Math.min(r.width,r.height)/1000; };
  const toSvg=(cx,cy)=>{ const r=svg.getBoundingClientRect(), s=scale(); return [(cx-r.left-(r.width-1000*s)/2)/s,(cy-r.top-(r.height-1000*s)/2)/s]; };
  const zoomAt=(sx,sy,f)=>{ const t=RT.tf, k=Math.max(0.6,Math.min(5,t.k*f)); f=k/t.k; t.x=sx-(sx-t.x)*f; t.y=sy-(sy-t.y)*f; t.k=k; rtApplyTf(); };
  svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1) start={x:e.clientX,y:e.clientY,t:Date.now(),tx:RT.tf.x,ty:RT.tf.y,tgt:e.target,moved:false};
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),k:RT.tf.k}; if(start) start.moved=true; } });
  svg.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2&&pinch){ const [a,b]=[...pts.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]); const [sx,sy]=toSvg((a[0]+b[0])/2,(a[1]+b[1])/2); zoomAt(sx,sy,(pinch.k*d/pinch.d)/RT.tf.k); return; }
    if(pts.size===1&&start){ const dx=e.clientX-start.x, dy=e.clientY-start.y; if(Math.hypot(dx,dy)>6) start.moved=true;
      if(start.moved){ const s=scale(); RT.tf.x=start.tx+dx/s; RT.tf.y=start.ty+dy/s; rtApplyTf(); } } });
  const end=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null;
    if(pts.size===0&&start){ if(!start.moved&&Date.now()-start.t<450){ const g=start.tgt.closest&&start.tgt.closest('[data-id]'); if(g) rtSelect(g.dataset.id); else if(RT.sel){ RT.sel=null; rtApplySel(); rtPanel(); } } start=null; } };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  svg.addEventListener('wheel',e=>{ e.preventDefault(); const [sx,sy]=toSvg(e.clientX,e.clientY); zoomAt(sx,sy,e.deltaY<0?1.12:1/1.12); },{passive:false});
}

// compact transfer table for the AI system prompt
function txPromptTable(){
  const V=getVals();
  const cur=TX_CUR.map(c=>`${c.name} [${c.cards}] (${c.note}): `+TX_EDGES.filter(e=>e.f===c.id).map(e=>`${TX_NAME(e.t)} ${ratioLbl(e)}${e.g?' G'+e.g:''}${e.st==='intro'?' intro':''}`).join(', ')).join('\n');
  const hops='Program hops: '+[...new Set(TX_EDGES.filter(e=>e.hop).map(e=>`${TX_NAME(e.f)}→${TX_NAME(e.t)} ${ratioLbl(e)}`))].join(', ');
  const vals='₹/pt values: '+TX_PROG.map(p=>`${p.short} ${V[p.id]}${p.anchor?'*':''}`).join(', ')+' (*=user anchor)';
  return cur+'\n'+hops+'\n'+vals;
}

// strip emoji from rendered text: icons carry meaning, data strings stay untouched
const EMO=/[\p{Extended_Pictographic}\p{Regional_Indicator}\u{FE0F}\u{200D}\u{20E3}]/gu;
function deEmoji(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){ if(EMO.test(n.nodeValue)){ EMO.lastIndex=0; n.nodeValue=n.nodeValue.replace(EMO,'').replace(/^\s+(?=\S)/,m=>m.includes('\n')?m:''); } EMO.lastIndex=0; }
}
const _emoObs=new MutationObserver(ms=>{ for(const m of ms) m.addedNodes.forEach(nd=>{ if(nd.nodeType===1) deEmoji(nd); else if(nd.nodeType===3&&EMO.test(nd.nodeValue)){ EMO.lastIndex=0; nd.nodeValue=nd.nodeValue.replace(EMO,''); } EMO.lastIndex=0; }); });

const SCREENS=['home','spend','routes','miles','cards','optimize','news','loyalty'];

let curScreen='home';
function go(name,_btn,opts={}){
  if(name==='more'){ openSheet('more-sheet'); return; }
  closeSheets(true);
  if(!SCREENS.includes(name)) name='home';
  const prev=curScreen, from=document.getElementById('screen-'+prev), to=document.getElementById('screen-'+name);
  if(name==='routes') buildRoutes();
  if(name==='optimize') buildOpt();
  if(name==='home') buildHome();
  if(prev!==name){
    from.classList.remove('active','enter-r','enter-l','enter-u'); from.classList.add('leaving');
    setTimeout(()=>from.classList.remove('leaving'),260);
    const dir=SCREENS.indexOf(name)>SCREENS.indexOf(prev)?'enter-r':'enter-l';
    to.classList.remove('enter-r','enter-l','enter-u'); void to.offsetWidth;
    to.classList.add('active',opts.dir||dir);

  curScreen=name; stagger(to); setTitle(TITLES[name]); setNav(NAV_OF(name));

function stagger(el){ const kids=[...el.children]; kids.forEach((k,i)=>k.style.setProperty('--i',i)); el.classList.remove('stagger'); void el.offsetWidth; el.classList.add('stagger'); }
function setTitle(t){

function setNav(n){

function openSheet(id){ document.querySelectorAll('.sheet.on').forEach(s=>{ if(s.id!==id) s.classList.remove('on'); });
  document.getElementById(id).classList.add('on'); document.getElementById('backdrop').classList.add('on'); }

  if(!silent) document.querySelectorAll('.catbtn.sel').forEach(b=>b.classList.remove('sel')); }
function bindDrag(panel,onClose){
  const handle=panel.querySelector('.grab'); if(!handle) return; let y0=null,dy=0;
  const mv=e=>{ if(y0===null) return; dy=Math.max(0,(e.touches?e.touches[0].clientY:e.clientY)-y0); panel.style.transform=`translate3d(0,${dy}px,0)`; };
  const up=()=>{ if(y0===null) return; panel.classList.remove('drag'); panel.style.transform=''; if(dy>110) onClose(); y0=null; dy=0; };
  const dn=e=>{ y0=(e.touches?e.touches[0].clientY:e.clientY); panel.classList.add('drag'); };
  handle.addEventListener('touchstart',dn,{passive:true}); handle.addEventListener('mousedown',dn);
  window.addEventListener('touchmove',mv,{passive:true}); window.addEventListener('mousemove',mv);
  window.addEventListener('touchend',up); window.addEventListener('mouseup',up);
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(chatOpen) toggleChat(); else closeSheets(); } if((e.metaKey||e.ctrlKey)&&e.key==='k'){ e.preventDefault(); if(!chatOpen) toggleChat(); } });

// ── reveal on scroll (IntersectionObserver) ──
const _revObs=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('seen'); _revObs.unobserve(en.target); animateIn(en.target); } }),{threshold:.15}):null;
function observeReveals(root){ root.querySelectorAll('.reveal').forEach(el=>{ if(_revObs) _revObs.observe(el); else { el.classList.add('seen'); animateIn(el); } }); }
function animateIn(el){
  el.querySelectorAll('.bt i[data-w]').forEach((b,i)=>setTimeout(()=>b.style.transform=`scaleX(${b.dataset.w})`,80*i));
  el.querySelectorAll('.ring .val[data-off]').forEach(r=>requestAnimationFrame(()=>r.style.strokeDashoffset=r.dataset.off));
  el.querySelectorAll('[data-count]').forEach(n=>countUp(n,+n.dataset.count,n.dataset.dec|0));
}
function countUp(el,target,dec=0){ const t0=performance.now(),d=900; const f=t=>{ const p=Math.min((t-t0)/d,1),e=1-(1-p)**4; el.textContent=(target*e).toFixed(dec); if(p<1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
